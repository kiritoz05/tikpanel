<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TikPanel - Control para Streamers</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh}
  input,select,button,textarea{font-family:'DM Sans',sans-serif}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:#0d0d15}
  ::-webkit-scrollbar-thumb{background:#2a2a3a;border-radius:2px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes heartPop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(0.4)}}
  .animate-in{animation:fadeIn 0.3s ease forwards}
  .live-dot{animation:pulse 1s infinite}
  .connecting-fill{animation:slide 1.4s ease-in-out infinite}
  .heart-pop{animation:heartPop 0.3s ease}
  .float-heart{position:absolute;animation:floatUp 1s ease forwards;pointer-events:none;font-size:22px;z-index:10}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const SERVER_URL = "https://tikpanel-production.up.railway.app";
const ELEVENLABS_API_KEY = "sk_c59a0c3dddc47a866083fc9b58a7dbd92b722fb2fb12da11";

// ── USUARIOS ─────────────────────────────────────────────
// Para agregar más usuarios, añade una línea aquí:
// "correo@email.com": { password: "contraseña", name: "Nombre", plan: "Free", avatar: "N" },
const USERS = {
  "admin@tikpanel.com":   { password: "admin123", name: "Admin",      plan: "Pro",  avatar: "A" },
  "usuario@tikpanel.com": { password: "pass123",  name: "StreamerPro",plan: "Free", avatar: "S" },
  "luzalva@tikpanel.com": { password: "luz2024",  name: "Luz Álva",   plan: "Pro",  avatar: "L" },
};

const DEFAULT_VOICES = [
  { id: "cgSgspJ2msm6clMCkdW9", name: "🇲🇽 Bella - Natural (Femenina)" },
  { id: "21m00Tcm4TlvDq8ikWAM", name: "🌍 Rachel - Multilingüe (Femenina)" },
  { id: "AZnzlk1XvdvUeBnXmlld", name: "⚡ Domi - Energética (Femenina)" },
  { id: "EXAVITQu4vr4xnSDxMaL", name: "🌟 Elli - Joven (Femenina)" },
  { id: "ErXwobaYiN019PkySvjV", name: "🎙️ Antoni - Natural (Masculina)" },
  { id: "VR6AewLTigWG4xSOukaG", name: "🔊 Arnold - Profunda (Masculina)" },
  { id: "pNInz6obpgDQGcFmaJgB", name: "📖 Adam - Narrador (Masculina)" },
  { id: "yoZ06aMxZJJ28mfd3POQ", name: "☕ Sam - Cálida (Masculina)" },
  { id: "onwK4e9ZLuTAKqWW03F9", name: "👑 Daniel - Presentador (Masculina)" },
];

const SOUNDS = ["Chime 🔔","Bell 🎵","Coin 💰","Aplausos 👏","Fanfarria 🎺"];

// ── HELPERS ───────────────────────────────────────────────
function saveSession(user){ localStorage.setItem("tikpanel_user", JSON.stringify(user)); }
function loadSession(){ try{ return JSON.parse(localStorage.getItem("tikpanel_user")); }catch(e){ return null; } }
function clearSession(){ localStorage.removeItem("tikpanel_user"); }
function saveState(key, val){ localStorage.setItem("tikpanel_"+key, JSON.stringify(val)); }
function loadState(key, def){ try{ const v=localStorage.getItem("tikpanel_"+key); return v!==null?JSON.parse(v):def; }catch(e){ return def; } }

// ── TOGGLE ────────────────────────────────────────────────
function Toggle({on, onChange}){
  return <div onClick={onChange} style={{width:46,height:26,borderRadius:13,cursor:"pointer",position:"relative",
    background:on?"#fe2c55":"#2a2a3a",transition:"background 0.25s",flexShrink:0}}>
    <div style={{position:"absolute",top:3,left:on?23:3,width:20,height:20,borderRadius:"50%",
      background:"#fff",transition:"left 0.25s",boxShadow:"0 2px 6px rgba(0,0,0,0.3)"}}/>
  </div>;
}

// ── LOGIN ─────────────────────────────────────────────────
function LoginScreen({onLogin}){
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  const handle=()=>{
    setErr(""); setLoading(true);
    setTimeout(()=>{
      const u=USERS[email.toLowerCase()];
      if(u&&u.password===pass){ onLogin({...u,email}); }
      else{ setErr("Credenciales incorrectas."); setLoading(false); }
    },700);
  };

  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
    background:"#0a0a0f",padding:20,position:"relative",overflow:"hidden"}}>
    <div style={{position:"fixed",width:700,height:700,borderRadius:"50%",
      background:"radial-gradient(circle,rgba(254,44,85,0.12) 0%,transparent 70%)",
      top:"50%",left:"50%",transform:"translate(-50%,-50%)",pointerEvents:"none"}}/>
    <div className="animate-in" style={{background:"#13131a",border:"1px solid #1e1e2e",borderRadius:24,
      padding:"48px 36px",width:"100%",maxWidth:420,position:"relative",zIndex:1,
      boxShadow:"0 40px 100px rgba(0,0,0,0.7)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
        <div style={{width:42,height:42,borderRadius:12,background:"linear-gradient(135deg,#fe2c55,#25f4ee)",
          display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:20}}>T</div>
        <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:26,letterSpacing:-1}}>
          ik<span style={{color:"#fe2c55"}}>Panel</span>
        </span>
      </div>
      <p style={{color:"#555",fontSize:13,marginBottom:28,marginTop:4}}>Plataforma de control para streamers</p>
      <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"rgba(254,44,85,0.08)",
        border:"1px solid rgba(254,44,85,0.2)",borderRadius:20,padding:"5px 14px",
        fontSize:12,color:"#fe2c55",marginBottom:28,fontWeight:600}}>🔒 Acceso solo por invitación</div>
      <div style={{marginBottom:16}}>
        <label style={{display:"block",color:"#666",fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Correo</label>
        <input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()}
          placeholder="tu@correo.com" type="email"
          style={{width:"100%",background:"#0d0d15",border:"1px solid #2a2a3a",borderRadius:12,
            padding:"13px 16px",color:"#fff",fontSize:14,outline:"none"}}/>
      </div>
      <div style={{marginBottom:20}}>
        <label style={{display:"block",color:"#666",fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Contraseña</label>
        <input value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()}
          placeholder="••••••••" type="password"
          style={{width:"100%",background:"#0d0d15",border:"1px solid #2a2a3a",borderRadius:12,
            padding:"13px 16px",color:"#fff",fontSize:14,outline:"none"}}/>
      </div>
      {err&&<div style={{background:"rgba(254,44,85,0.08)",border:"1px solid rgba(254,44,85,0.25)",
        borderRadius:10,padding:"10px 14px",color:"#fe2c55",fontSize:13,marginBottom:16}}>{err}</div>}
      <button onClick={handle} disabled={loading}
        style={{width:"100%",background:loading?"#2a2a3a":"linear-gradient(135deg,#fe2c55,#ff6b81)",
          border:"none",borderRadius:12,padding:"14px",color:"#fff",fontSize:15,fontWeight:700,
          cursor:loading?"not-allowed":"pointer"}}>
        {loading?"Verificando...":"Ingresar →"}
      </button>
      <p style={{color:"#333",fontSize:12,textAlign:"center",marginTop:20}}>
        ¿No tienes acceso? Solicítalo al administrador
      </p>
    </div>
  </div>;
}

// ── APP ───────────────────────────────────────────────────
function App(){
  // ── Sesión persistente ──
  const [user, setUser] = useState(()=> loadSession());
  const [tab, setTab] = useState(()=> loadState("tab","dashboard"));
  const [sidebarOpen, setSidebarOpen] = useState(false);

  // ── Conexión ──
  const [tiktokUser, setTiktokUser] = useState(()=> loadState("tiktokUser",""));
  const [connected, setConnected] = useState(false);
  const [connecting, setConnecting] = useState(false);
  const [dots, setDots] = useState("");

  // ── Stats y actividad ──
  const [stats, setStats] = useState({viewers:0,gifts:0,follows:0,messages:0,likes:0});
  const [log, setLog] = useState([]);
  const [likeAnim, setLikeAnim] = useState(false);
  const [floatingHearts, setFloatingHearts] = useState([]);

  // ── Ranking ──
  const [tapRanking, setTapRanking] = useState([]);
  const [likeRanking, setLikeRanking] = useState([]);
  const [totalDiamonds, setTotalDiamonds] = useState(0);
  const [totalLikes, setTotalLikes] = useState(0);

  // ── TTS ──
  const [ttsOn, setTtsOn] = useState(()=> loadState("ttsOn",true));
  const [ttsVol, setTtsVol] = useState(()=> loadState("ttsVol",80));
  const [ttsVoice, setTtsVoice] = useState(()=> loadState("ttsVoice","cgSgspJ2msm6clMCkdW9"));
  const [activeVoice, setActiveVoice] = useState(()=> loadState("ttsVoice","cgSgspJ2msm6clMCkdW9"));
  const [voiceApplied, setVoiceApplied] = useState(false);
  const [voices, setVoices] = useState(DEFAULT_VOICES);
  const [loadingVoices, setLoadingVoices] = useState(false);
  const ttsOnRef = useRef(ttsOn);
  const ttsVolRef = useRef(ttsVol);
  const activeVoiceRef = useRef(activeVoice);

  // ── Alertas ──
  const [alertsOn, setAlertsOn] = useState(()=> loadState("alertsOn",true));
  const [giftSounds, setGiftSounds] = useState(()=> loadState("giftSounds",[
    {id:1, gift:"Rosa", minCount:1, soundUrl:"", soundName:""},
    {id:2, gift:"León", minCount:1, soundUrl:"", soundName:""},
    {id:3, gift:"Universo", minCount:1, soundUrl:"", soundName:""},
    {id:4, gift:"Corazón", minCount:1, soundUrl:"", soundName:""},
    {id:5, gift:"Diamante", minCount:1, soundUrl:"", soundName:""},
    {id:6, gift:"Otros", minCount:1, soundUrl:"", soundName:""},
  ]));

  // ── Persistir cambios importantes ──
  useEffect(()=>{ saveState("tab",tab); },[tab]);
  useEffect(()=>{ saveState("tiktokUser",tiktokUser); },[tiktokUser]);
  useEffect(()=>{ ttsOnRef.current=ttsOn; saveState("ttsOn",ttsOn); },[ttsOn]);
  useEffect(()=>{ ttsVolRef.current=ttsVol; saveState("ttsVol",ttsVol); },[ttsVol]);
  useEffect(()=>{ saveState("alertsOn",alertsOn); },[alertsOn]);
  useEffect(()=>{ saveState("giftSounds",giftSounds.map(g=>({...g,soundUrl:""}))); },[giftSounds]);

  // ── Cargar voces de ElevenLabs ──
  useEffect(()=>{
    setLoadingVoices(true);
    fetch("https://api.elevenlabs.io/v1/voices",{headers:{"xi-api-key":ELEVENLABS_API_KEY}})
      .then(r=>r.json())
      .then(data=>{
        if(data.voices?.length>0){
          const mapped=data.voices.map(v=>({id:v.voice_id,name:v.name}));
          setVoices([...DEFAULT_VOICES,...mapped.filter(v=>!DEFAULT_VOICES.find(d=>d.id===v.id))]);
        }
      })
      .catch(()=>{})
      .finally(()=>setLoadingVoices(false));
  },[]);

  // ── Socket ──
  const socketRef = useRef(null);

  useEffect(()=>{
    const socket = io(SERVER_URL, {transports:["websocket"]});
    socketRef.current = socket;

    socket.on("event",(data)=>{
      if(data.type==="chat"){
        setLog(p=>[{type:"msg",text:`💬 @${data.user}: ${data.comment}`},...p].slice(0,30));
        setStats(p=>({...p,messages:p.messages+1}));
      } else if(data.type==="gift"){
        setLog(p=>[{type:"gift",text:`🎁 @${data.nickname} envió ${data.giftCount}x ${data.giftName}`},...p].slice(0,30));
        setStats(p=>({...p,gifts:p.gifts+1}));
        const diamonds = data.diamondCount||0;
        setTotalDiamonds(p=>p+diamonds);
        setTapRanking(prev=>{
          const ex=prev.find(u=>u.user===data.user);
          let upd = ex
            ? prev.map(u=>u.user===data.user?{...u,diamonds:u.diamonds+diamonds,gifts:u.gifts+1}:u)
            : [...prev,{user:data.user,nickname:data.nickname||data.user,diamonds,gifts:1}];
          return upd.sort((a,b)=>b.diamonds-a.diamonds).slice(0,5);
        });
        // Reproducir sonido personalizado
        playGiftSound(data.giftName||"");
      } else if(data.type==="follow"){
        setLog(p=>[{type:"follow",text:`➕ @${data.user} te siguió`},...p].slice(0,30));
        setStats(p=>({...p,follows:p.follows+1}));
      } else if(data.type==="like"){
        setLog(p=>[{type:"like",text:`❤️ @${data.user} dio ${data.likeCount} likes`},...p].slice(0,30));
        const lc = data.likeCount||1;
        setStats(p=>({...p,likes:p.likes+lc}));
        setTotalLikes(p=>p+lc);
        setLikeAnim(true);
        setTimeout(()=>setLikeAnim(false),300);
        const hid=Date.now();
        setFloatingHearts(p=>[...p,{id:hid,x:Math.random()*60+20}]);
        setTimeout(()=>setFloatingHearts(p=>p.filter(h=>h.id!==hid)),1000);
        setLikeRanking(prev=>{
          const ex=prev.find(u=>u.user===data.user);
          let upd = ex
            ? prev.map(u=>u.user===data.user?{...u,count:u.count+lc}:u)
            : [...prev,{user:data.user,nickname:data.user,count:lc}];
          return upd.sort((a,b)=>b.count-a.count).slice(0,5);
        });
      }
    });

    socket.on("tts_audio",(data)=>{
      try{
        const audio=new Audio(`data:audio/mpeg;base64,${data.audio}`);
        audio.volume=ttsVolRef.current/100;
        audio.play();
      }catch(e){}
    });

    socket.on("gift_alert",(data)=>{
      setLog(p=>[{type:"gift",text:`🔊 ${data.message}`},...p].slice(0,30));
    });

    socket.on("viewers",(data)=>{ setStats(p=>({...p,viewers:data.count})); });
    socket.on("disconnected",()=>{ setConnected(false); });
    socket.on("error",(data)=>{ setLog(p=>[{type:"sys",text:`⚠️ ${data.message}`},...p]); });

    return()=>socket.disconnect();
  },[]);

  // ── Reproducir sonido personalizado por regalo ──
  const giftSoundsRef = useRef(giftSounds);
  useEffect(()=>{ giftSoundsRef.current=giftSounds; },[giftSounds]);

  const playGiftSound = useCallback((giftName)=>{
    const name = giftName.toLowerCase();
    const sounds = giftSoundsRef.current;
    let match = sounds.find(s=> s.gift!=="Otros" && name.includes(s.gift.toLowerCase()) && s.soundUrl);
    if(!match) match = sounds.find(s=>s.gift==="Otros" && s.soundUrl);
    if(match?.soundUrl){
      try{
        const audio=new Audio(match.soundUrl);
        audio.volume=ttsVolRef.current/100;
        audio.play();
      }catch(e){}
    }
  },[]);

  // ── Aplicar voz ──
  const applyVoice = ()=>{
    activeVoiceRef.current = ttsVoice;
    setActiveVoice(ttsVoice);
    saveState("ttsVoice", ttsVoice);
    setVoiceApplied(true);
    setTimeout(()=>setVoiceApplied(false),2500);
    fetch(`${SERVER_URL}/setvoice`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({voiceId:ttsVoice})
    }).catch(()=>{});
  };

  // ── Conectar ──
  const connect = async()=>{
    if(!tiktokUser.trim()) return;
    setConnecting(true);
    try{
      const res=await fetch(`${SERVER_URL}/connect`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:tiktokUser})
      });
      const data=await res.json();
      if(data.success){
        setConnecting(false); setConnected(true);
        setStats({viewers:0,gifts:0,follows:0,messages:0,likes:0});
        setTotalDiamonds(0); setTotalLikes(0);
        setTapRanking([]); setLikeRanking([]);
        setLog([{type:"sys",text:`✅ Conectado a @${tiktokUser}`}]);
      } else {
        setConnecting(false);
        setLog([{type:"sys",text:`⚠️ ${data.error||"No se pudo conectar. ¿Estás en LIVE?"}`}]);
      }
    }catch(e){
      setConnecting(false);
      setLog([{type:"sys",text:"⚠️ Error al conectar con el servidor"}]);
    }
  };

  const disconnect = async()=>{
    await fetch(`${SERVER_URL}/disconnect`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:tiktokUser})
    }).catch(()=>{});
    setConnected(false); setLog([]);
    setStats({viewers:0,gifts:0,follows:0,messages:0,likes:0});
    setTotalDiamonds(0); setTotalLikes(0);
  };

  const logout = ()=>{ clearSession(); setUser(null); };

  // ── Conectar dots ──
  useEffect(()=>{
    if(!connecting) return;
    const t=setInterval(()=>setDots(d=>d.length>=3?"":d+"."),400);
    return()=>clearInterval(t);
  },[connecting]);

  // ── Login ──
  if(!user) return <LoginScreen onLogin={(u)=>{ saveSession(u); setUser(u); }}/>;

  const tabs=[
    {id:"dashboard",icon:"⚡",label:"Dashboard"},
    {id:"tts",icon:"🔊",label:"TTS"},
    {id:"alerts",icon:"🔔",label:"Alertas"},
    {id:"ranking",icon:"🏆",label:"Ranking"},
    {id:"chat",icon:"💬",label:"Chat Bot"},
  ];

  const logColor={gift:"rgba(254,44,85,0.1)",follow:"rgba(37,244,238,0.1)",
    msg:"rgba(255,255,255,0.04)",like:"rgba(254,44,85,0.06)",sys:"rgba(37,244,238,0.08)"};
  const logBorder={gift:"#fe2c55",follow:"#25f4ee",msg:"#2a2a3a",like:"#fe2c55",sys:"#25f4ee"};

  // ── Subir sonido ──
  const handleSoundUpload = (giftId, file)=>{
    if(!file) return;
    const url = URL.createObjectURL(file);
    setGiftSounds(prev=>prev.map(g=>g.id===giftId?{...g,soundUrl:url,soundName:file.name}:g));
  };

  return <div style={{display:"flex",minHeight:"100vh",background:"#0a0a0f"}}>

    {/* Overlay móvil */}
    {sidebarOpen&&<div onClick={()=>setSidebarOpen(false)}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:40}}/>}

    {/* Sidebar */}
    <div style={{width:240,background:"#10101a",borderRight:"1px solid #1e1e2e",
      display:"flex",flexDirection:"column",padding:"20px 14px",
      position:"fixed",top:0,bottom:0,left:0,zIndex:50,
      transform:sidebarOpen?"translateX(0)":"translateX(-100%)",
      transition:"transform 0.3s ease"}}>

      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:20,paddingLeft:6}}>
        <div style={{width:32,height:32,borderRadius:9,background:"linear-gradient(135deg,#fe2c55,#25f4ee)",
          display:"flex",alignItems:"center",justifyContent:"center",
          fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:16}}>T</div>
        <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,letterSpacing:-0.5}}>
          ik<span style={{color:"#fe2c55"}}>Panel</span>
        </span>
      </div>

      <div style={{display:"flex",alignItems:"center",gap:10,background:"#1a1a2a",
        borderRadius:12,padding:"10px 12px",marginBottom:12}}>
        <div style={{width:34,height:34,borderRadius:"50%",flexShrink:0,
          background:"linear-gradient(135deg,#fe2c55,#25f4ee)",
          display:"flex",alignItems:"center",justifyContent:"center",
          fontWeight:800,fontSize:15,fontFamily:"'Syne',sans-serif"}}>{user.avatar}</div>
        <div style={{overflow:"hidden"}}>
          <div style={{fontSize:13,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{user.name}</div>
          <div style={{fontSize:11,color:"#fe2c55",fontWeight:600,marginTop:2}}>{user.plan}</div>
        </div>
      </div>

      <div style={{display:"flex",alignItems:"center",gap:8,
        background:connected?"rgba(37,244,238,0.06)":"rgba(255,255,255,0.03)",
        border:`1px solid ${connected?"rgba(37,244,238,0.25)":"#1e1e2e"}`,
        borderRadius:20,padding:"6px 12px",fontSize:12,
        color:connected?"#25f4ee":"#444",marginBottom:18,overflow:"hidden"}}>
        <div className={connected?"live-dot":""} style={{width:7,height:7,borderRadius:"50%",flexShrink:0,
          background:connected?"#25f4ee":"#333",boxShadow:connected?"0 0 8px #25f4ee":"none"}}/>
        <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {connected?`@${tiktokUser}`:"Sin conexión"}
        </span>
      </div>

      <nav style={{display:"flex",flexDirection:"column",gap:3,flex:1}}>
        {tabs.map(t=><button key={t.id} onClick={()=>{setTab(t.id);setSidebarOpen(false);}}
          style={{display:"flex",alignItems:"center",gap:12,
            background:tab===t.id?"rgba(254,44,85,0.1)":"transparent",
            border:tab===t.id?"1px solid rgba(254,44,85,0.2)":"1px solid transparent",
            borderRadius:10,padding:"11px 12px",color:tab===t.id?"#fff":"#555",
            cursor:"pointer",fontSize:13,fontWeight:tab===t.id?700:500,textAlign:"left"}}>

            <div style={{background:"rgba(37,244,238,0.04)",border:"1px solid rgba(37,244,238,0.12)",
              borderRadius:10,padding:"12px 14px",color:"#aaa",fontSize:13,lineHeight:1.7,marginBottom:16}}>
              💡 El bot responde automáticamente cuando alguien escribe una palabra clave en tu LIVE.
            </div>
            {[
              {trigger:"!hola",response:"¡Hola! Bienvenido al LIVE de Luz Álva 🎉"},
              {trigger:"!precio",response:"Revisa el link en mi bio 👆"},
              {trigger:"!redes",response:"Sígueme en todas mis redes 📱"},
            ].map((cmd,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:10,
              background:"#0d0d15",borderRadius:10,padding:"12px 14px",marginBottom:10}}>
              <span style={{color:"#25f4ee",fontWeight:700,fontSize:13,minWidth:70}}>{cmd.trigger}</span>
              <span style={{color:"#333"}}>→</span>
              <span style={{color:"#aaa",fontSize:13,flex:1}}>{cmd.response}</span>
            </div>)}
            <button style={{background:"rgba(254,44,85,0.08)",border:"1px dashed rgba(254,44,85,0.3)",
              borderRadius:10,padding:"11px 20px",color:"#fe2c55",fontWeight:700,
              cursor:"pointer",fontSize:13,width:"100%",marginTop:4}}>
              + Añadir comando
            </button>
          </div>
        </div>}

      </div>
    </div>
  </div>;
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
