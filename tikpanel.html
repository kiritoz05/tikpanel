<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TikPanel - Control para Streamers</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh}
  input,select,button{font-family:'DM Sans',sans-serif}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:#0d0d15}
  ::-webkit-scrollbar-thumb{background:#2a2a3a;border-radius:2px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes heartPop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(0.5)}}
  .animate-in{animation:fadeIn 0.4s ease forwards}
  .live-dot{animation:pulse 1s infinite}
  .connecting-fill{animation:slide 1.5s ease-in-out infinite}
  .heart-pop{animation:heartPop 0.3s ease}
  .float-heart{position:absolute;animation:floatUp 1s ease forwards;pointer-events:none;font-size:20px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const SERVER_URL = "https://tikpanel-production.up.railway.app"; // CAMBIA POR TU URL

// Voces predefinidas en español (se cargarán desde ElevenLabs luego)
const DEFAULT_VOICES = [
  { id: "cgSgspJ2msm6clMCkdW9", name: "🇲🇽 Bella - Español Natural (Femenina)" },
  { id: "21m00Tcm4TlvDq8ikWAM", name: "🌍 Rachel - Multilingüe (Femenina)" },
  { id: "AZnzlk1XvdvUeBnXmlld", name: "⚡ Domi - Energética (Femenina)" },
  { id: "EXAVITQu4vr4xnSDxMaL", name: "🌟 Elli - Joven (Femenina)" },
  { id: "MF3mGyEYCl7XYWbV9V6O", name: "🇦🇷 Elli - Argentina (Femenina)" },
  { id: "ErXwobaYiN019PkySvjV", name: "🎙️ Antoni - Natural (Masculina)" },
  { id: "VR6AewLTigWG4xSOukaG", name: "🔊 Arnold - Profunda (Masculina)" },
  { id: "pNInz6obpgDQGcFmaJgB", name: "📖 Adam - Narrador (Masculina)" },
  { id: "yoZ06aMxZJJ28mfd3POQ", name: "☕ Sam - Cálida (Masculina)" },
  { id: "TxGEqnHWrfWFTfGW9XjX", name: "🇪🇸 Josh - España (Masculina)" },
  { id: "g5CIjZEefAph4nQFvHAz", name: "🎭 Ethan - Expresiva (Masculina)" },
  { id: "onwK4e9ZLuTAKqWW03F9", name: "👑 Daniel - Presentador (Masculina)" },
];

const USERS = {
  "admin@tikpanel.com": { password: "admin123", name: "Admin", plan: "Pro", avatar: "A" },
  "usuario@tikpanel.com": { password: "pass123", name: "StreamerPro", plan: "Free", avatar: "S" },
};

const SOUNDS = ["Chime 🔔","Bell 🎵","Coin 💰","Aplausos 👏","Fanfarria 🎺"];

function Toggle({on, onChange}){
  return(
    <div onClick={onChange} style={{width:46,height:26,borderRadius:13,cursor:"pointer",position:"relative",
      background:on?"#fe2c55":"#2a2a3a",transition:"background 0.25s",flexShrink:0}}>
      <div style={{position:"absolute",top:3,left:on?23:3,width:20,height:20,borderRadius:"50%",
        background:"#fff",transition:"left 0.25s",boxShadow:"0 2px 6px rgba(0,0,0,0.3)"}}/>
    </div>
  );
}

function LoginScreen({onLogin}){
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  const handle=()=>{
    setErr("");setLoading(true);
    setTimeout(()=>{
      const u=USERS[email.toLowerCase()];
      if(u&&u.password===pass){
        const userData = {...u, email: email.toLowerCase()};
        localStorage.setItem("tikpanel_user", JSON.stringify(userData));
        onLogin(userData);
      } else {
        setErr("Credenciales incorrectas.");
        setLoading(false);
      }
    },800);
  };

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
      background:"#0a0a0f",position:"relative",overflow:"hidden",padding:20}}>
      <div style={{position:"fixed",width:700,height:700,borderRadius:"50%",
        background:"radial-gradient(circle,rgba(254,44,85,0.12) 0%,transparent 70%)",
        top:"50%",left:"50%",transform:"translate(-50%,-50%)",pointerEvents:"none"}}/>
      <div className="animate-in" style={{background:"#13131a",border:"1px solid #1e1e2e",borderRadius:24,
        padding:"48px 40px",width:"100%",maxWidth:420,position:"relative",zIndex:1,
        boxShadow:"0 40px 100px rgba(0,0,0,0.7)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
          <div style={{width:42,height:42,borderRadius:12,
            background:"linear-gradient(135deg,#fe2c55,#25f4ee)",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:20}}>T</div>
          <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:26,letterSpacing:-1}}>
            ik<span style={{color:"#fe2c55"}}>Panel</span>
          </span>
        </div>
        <p style={{color:"#555",fontSize:13,marginBottom:28,fontWeight:500}}>
          Plataforma de control para streamers de TikTok
        </p>
        <div style={{display:"inline-flex",alignItems:"center",gap:8,
          background:"rgba(254,44,85,0.08)",border:"1px solid rgba(254,44,85,0.2)",
          borderRadius:20,padding:"5px 14px",fontSize:12,color:"#fe2c55",marginBottom:32,fontWeight:600}}>
          🔒 Acceso solo por invitación
        </div>
        <div style={{marginBottom:18}}>
          <label style={{display:"block",color:"#666",fontSize:11,fontWeight:600,
            letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Correo electrónico</label>
          <input value={email} onChange={e=>setEmail(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&handle()}
            placeholder="tu@correo.com" type="email"
            style={{width:"100%",background:"#0d0d15",border:"1px solid #2a2a3a",borderRadius:12,
              padding:"13px 16px",color:"#fff",fontSize:14,outline:"none"}}/>
        </div>
        <div style={{marginBottom:20}}>
          <label style={{display:"block",color:"#666",fontSize:11,fontWeight:600,
            letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Contraseña</label>
          <input value={pass} onChange={e=>setPass(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&handle()}
            placeholder="••••••••" type="password"
            style={{width:"100%",background:"#0d0d15",border:"1px solid #2a2a3a",borderRadius:12,
              padding:"13px 16px",color:"#fff",fontSize:14,outline:"none"}}/>
        </div>
        {err&&<div style={{background:"rgba(254,44,85,0.08)",border:"1px solid rgba(254,44,85,0.25)",
          borderRadius:10,padding:"10px 14px",color:"#fe2c55",fontSize:13,marginBottom:16}}>{err}</div>}
        <button onClick={handle} disabled={loading}
          style={{width:"100%",background:loading?"#2a2a3a":"linear-gradient(135deg,#fe2c55,#ff6b81)",
            border:"none",borderRadius:12,padding:"14px",color:"#fff",fontSize:15,fontWeight:700,
            cursor:loading?"not-allowed":"pointer",transition:"all 0.2s",letterSpacing:0.3}}>
          {loading?"Verificando...":"Ingresar →"}
        </button>
        <p style={{color:"#333",fontSize:12,textAlign:"center",marginTop:24}}>
          ¿No tienes acceso? Solicítalo al administrador
        </p>
      </div>
    </div>
  );
}

function App(){
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState("dashboard");
  const [tiktokUser,setTiktokUser]=useState("");
  const [connected,setConnected]=useState(false);
  const [connecting,setConnecting]=useState(false);
  const [dots,setDots]=useState("");
  const [stats,setStats]=useState({viewers:0,gifts:0,follows:0,messages:0,likes:0});
  const [log,setLog]=useState([]);
  const [likeAnim, setLikeAnim]=useState(false);
  const [floatingHearts, setFloatingHearts]=useState([]);
  const [ttsOn,setTtsOn]=useState(true);
  const [ttsVoice,setTtsVoice]=useState("cgSgspJ2msm6clMCkdW9");
  const [activeVoice,setActiveVoice]=useState("cgSgspJ2msm6clMCkdW9");
  const [voiceApplied,setVoiceApplied]=useState(false);
  const [ttsVol,setTtsVol]=useState(80);
  const [voices, setVoices]=useState(DEFAULT_VOICES);
  const [loadingVoices, setLoadingVoices]=useState(false);
  const [likeRanking, setLikeRanking]=useState([]);
  const [tapRanking, setTapRanking]=useState([]);
  const socketRef = useRef(null);
  const ttsVolRef = useRef(80);
  const ttsOnRef = useRef(true);

  useEffect(()=>{ ttsOnRef.current = ttsOn; },[ttsOn]);
  useEffect(()=>{ ttsVolRef.current = ttsVol; },[ttsVol]);

  // Cargar sesión guardada
  useEffect(()=>{
    const savedUser = localStorage.getItem("tikpanel_user");
    if(savedUser){
      try{
        const u = JSON.parse(savedUser);
        setUser(u);
      }catch(e){}
    }
  },[]);

  // Cargar voces desde ElevenLabs (solo para mostrar nombres)
  useEffect(()=>{
    setLoadingVoices(true);
    fetch("https://api.elevenlabs.io/v1/voices")
      .then(r=>r.json())
      .then(data=>{
        if(data.voices && data.voices.length > 0){
          const mapped = data.voices.map(v=>({ id: v.voice_id, name: v.name }));
          setVoices([...DEFAULT_VOICES, ...mapped.filter(v=>!DEFAULT_VOICES.find(d=>d.id===v.id))]);
        }
      })
      .catch(()=>{})
      .finally(()=>setLoadingVoices(false));
  },[]);

  // Configurar socket y eventos
  useEffect(()=>{
    const socket = io(SERVER_URL, { transports: ["websocket"] });
    socketRef.current = socket;

    socket.on("event", (data) => {
      if(data.type === "chat"){
        setLog(p=>[{type:"msg", text:`💬 @${data.user}: ${data.comment}`},...p].slice(0,25));
        setStats(p=>({...p, messages: p.messages+1}));
        // TTS manejado por el servidor, no hacemos nada aquí
      } else if(data.type === "gift"){
        setLog(p=>[{type:"gift", text:`🎁 @${data.user} envió ${data.giftCount}x ${data.giftName}`},...p].slice(0,25));
        setStats(p=>({...p, gifts: p.gifts+1}));
      } else if(data.type === "follow"){
        setLog(p=>[{type:"follow", text:`➕ @${data.user} te siguió`},...p].slice(0,25));
        setStats(p=>({...p, follows: p.follows+1}));
      } else if(data.type === "like"){
        setLog(p=>[{type:"msg", text:`❤️ @${data.user} dio ${data.likeCount} likes`},...p].slice(0,25));
        setStats(p=>({...p, likes: p.likes + (data.likeCount || 1)}));
        setLikeAnim(true);
        setTimeout(()=>setLikeAnim(false), 300);
        const id = Date.now();
        setFloatingHearts(p=>[...p, {id, x: Math.random()*60+20}]);
        setTimeout(()=>setFloatingHearts(p=>p.filter(h=>h.id!==id)), 1000);
      }
    });

    socket.on("tts_audio", (data) => {
      try {
        const audio = new Audio(`data:audio/mpeg;base64,${data.audio}`);
        audio.volume = ttsVolRef.current / 100;
        audio.play();
      } catch(e) { console.error("Audio error:", e); }
    });

    socket.on("viewers", (data) => {
      setStats(p=>({...p, viewers: data.count}));
    });

    socket.on("disconnected", () => {
      setConnected(false);
      setLog(p=>[{type:"sys", text:"❌ Desconectado del LIVE"},...p]);
    });

    socket.on("error", (data) => {
      setLog(p=>[{type:"sys", text:`⚠️ Error: ${data.message}`},...p]);
    });

    socket.on("ranking_update", (data) => {
      // Actualizar rankings con los datos acumulados del servidor
      setTapRanking(data.diamonds || []);
      setLikeRanking(data.likes || []);
      setStats(prev => ({
        ...prev,
        likes: data.totalLikes !== undefined ? data.totalLikes : prev.likes,
        gifts: data.totalDiamonds !== undefined ? data.totalDiamonds : prev.gifts, // usamos gifts como total diamantes? mejor separar
      }));
    });

    return () => { socket.disconnect(); };
  }, []);

  useEffect(()=>{
    if(!connecting)return;
    const t=setInterval(()=>setDots(d=>d.length>=3?"":d+"."),400);
    return()=>clearInterval(t);
  },[connecting]);

  const connect = async()=>{
    if(!tiktokUser.trim())return;
    setConnecting(true);
    try {
      const res = await fetch(`${SERVER_URL}/connect`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: tiktokUser })
      });
      const data = await res.json();
      if(data.success){
        setConnecting(false); setConnected(true);
        setStats({viewers:0,gifts:0,follows:0,messages:0,likes:0});
        setLog([{type:"sys", text:`✅ Conectado a @${tiktokUser} — esperando actividad del LIVE`}]);
        // Unirse a la sala del LIVE para recibir ranking actualizado
        if(socketRef.current) {
          socketRef.current.emit("join_live", tiktokUser);
          // Enviar la voz actual al servidor
          await fetch(`${SERVER_URL}/setvoice`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: tiktokUser, voiceId: activeVoice })
          });
        }
      } else {
        setConnecting(false);
        setLog([{type:"sys", text:`⚠️ ${data.error || "No se pudo conectar. ¿Estás en LIVE?"}`}]);
      }
    } catch(e) {
      setConnecting(false);
      setLog([{type:"sys", text:"⚠️ Error al conectar con el servidor"}]);
    }
  };

  const disconnect = async()=>{
    await fetch(`${SERVER_URL}/disconnect`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username: tiktokUser})
    }).catch(()=>{});
    setConnected(false);
    setLog([]);
    setStats({viewers:0,gifts:0,follows:0,messages:0,likes:0});
    setTapRanking([]);
    setLikeRanking([]);
  };

  const applyVoice = async () => {
    if(!ttsOn) return;
    setActiveVoice(ttsVoice);
    setVoiceApplied(true);
    setTimeout(()=>setVoiceApplied(false), 2000);
    // Enviar al servidor la nueva voz si estamos conectados
    if(connected && tiktokUser) {
      try {
        await fetch(`${SERVER_URL}/setvoice`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: tiktokUser, voiceId: ttsVoice })
        });
      } catch(e) { console.error("Error al cambiar la voz:", e); }
    }
  };

  if(!user) return <LoginScreen onLogin={setUser}/>;

  const tabs=[
    {id:"dashboard",icon:"⚡",label:"Dashboard"},
    {id:"tts",icon:"🔊",label:"TTS"},
    {id:"alerts",icon:"🔔",label:"Alertas"},
    {id:"chat",icon:"💬",label:"Chat Bot"},
    {id:"ranking",icon:"🏆",label:"Ranking"},
  ];

  const logColor={
    gift:"rgba(254,44,85,0.1)",follow:"rgba(37,244,238,0.1)",
    msg:"rgba(255,255,255,0.04)",tts:"rgba(124,58,237,0.1)",sys:"rgba(37,244,238,0.08)"
  };
  const logBorder={
    gift:"#fe2c55",follow:"#25f4ee",msg:"#333",tts:"#a78bfa",sys:"#25f4ee"
  };

  return(
    <div style={{display:"flex",minHeight:"100vh",background:"#0a0a0f"}}>
      {/* Sidebar fijo para escritorio, móvil con toggle */}
      <div style={{width:240,background:"#10101a",borderRight:"1px solid #1e1e2e",
        display:"flex",flexDirection:"column",padding:"24px 14px",
        position:"fixed",top:0,bottom:0,left:0,zIndex:50,
        transform:"translateX(0)",transition:"transform 0.3s ease"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:24,paddingLeft:6}}>
          <div style={{width:32,height:32,borderRadius:9,
            background:"linear-gradient(135deg,#fe2c55,#25f4ee)",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:16}}>T</div>
          <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,letterSpacing:-0.5}}>
            ik<span style={{color:"#fe2c55"}}>Panel</span>
          </span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,
          background:"#1a1a2a",borderRadius:12,padding:"12px 12px",marginBottom:14}}>
          <div style={{width:34,height:34,borderRadius:"50%",flexShrink:0,
            background:"linear-gradient(135deg,#fe2c55,#25f4ee)",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontWeight:800,fontSize:15}}>{user.avatar}</div>
          <div style={{overflow:"hidden"}}>
            <div style={{fontSize:13,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{user.name}</div>
            <div style={{fontSize:11,color:"#fe2c55",fontWeight:600,marginTop:2}}>{user.plan}</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,
          background:connected?"rgba(37,244,238,0.06)":"rgba(255,255,255,0.03)",
          border:`1px solid ${connected?"rgba(37,244,238,0.25)":"#1e1e2e"}`,
          borderRadius:20,padding:"6px 12px",fontSize:12,
          color:connected?"#25f4ee":"#444",marginBottom:22,overflow:"hidden"}}>
          <div style={{width:7,height:7,borderRadius:"50%",flexShrink:0,
            background:connected?"#25f4ee":"#333",
            boxShadow:connected?"0 0 8px #25f4ee":"none"}}
            className={connected?"live-dot":""}/>
          <span>{connected?`@${tiktokUser}`:"Sin conexión"}</span>
        </div>
        <nav style={{display:"flex",flexDirection:"column",gap:3,flex:1}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)}
              style={{display:"flex",alignItems:"center",gap:12,
                background:tab===t.id?"rgba(254,44,85,0.1)":"transparent",
                border:tab===t.id?"1px solid rgba(254,44,85,0.2)":"1px solid transparent",
                borderRadius:10,padding:"11px 12px",
                color:tab===t.id?"#fff":"#555",cursor:"pointer",
                fontSize:13,fontWeight:tab===t.id?700:500,textAlign:"left"}}>
              <span style={{fontSize:17}}>{t.icon}</span>{t.label}
            </button>
          ))}
        </nav>
        <button onClick={()=>{localStorage.removeItem("tikpanel_user"); setUser(null); setConnected(false);}}
          style={{background:"transparent",border:"1px solid #1e1e2e",borderRadius:10,
            padding:"10px 12px",color:"#444",cursor:"pointer",fontSize:13,marginTop:8}}>
          Cerrar sesión
        </button>
      </div>

      <div style={{flex:1,marginLeft:240,display:"flex",flexDirection:"column",minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
          padding:"16px 20px",borderBottom:"1px solid #1e1e2e",
          background:"#0a0a0f",position:"sticky",top:0,zIndex:30}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:17}}>
              {tabs.find(t=>t.id===tab)?.icon} {tabs.find(t=>t.id===tab)?.label}
            </div>
          </div>
          {connected&&(
            <div style={{display:"flex",alignItems:"center",gap:7,
              background:"rgba(254,44,85,0.1)",border:"1px solid rgba(254,44,85,0.25)",
              borderRadius:20,padding:"5px 14px",color:"#fe2c55",fontWeight:800,fontSize:11,letterSpacing:1}}>
              <div className="live-dot" style={{width:7,height:7,borderRadius:"50%",background:"#fe2c55",boxShadow:"0 0 8px #fe2c55"}}/>
              EN VIVO
            </div>
          )}
        </div>

        <div style={{padding:20,flex:1,overflowY:"auto"}}>
          {tab==="dashboard"&&(
            <div className="animate-in">
              <div style={{background:"#13131a",border:"1px solid #1e1e2e",borderRadius:16,padding:20,marginBottom:16}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14,marginBottom:16}}>🎯 Conectar al LIVE</div>
                <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                  <div style={{display:"flex",alignItems:"center",flex:1,minWidth:160,
                    background:"#0d0d15",border:"1px solid #2a2a3a",borderRadius:10,overflow:"hidden"}}>
                    <span style={{color:"#fe2c55",fontWeight:800,padding:"0 12px",fontSize:16}}>@</span>
                    <input value={tiktokUser} onChange={e=>setTiktokUser(e.target.value)}
                      placeholder="usuario_tiktok" disabled={connected||connecting}
                      style={{flex:1,background:"transparent",border:"none",padding:"12px 8px 12px 0",
                        color:"#fff",fontSize:14,outline:"none"}}/>
                  </div>
                  {!connected?(
                    <button onClick={connect} disabled={connecting||!tiktokUser}
                      style={{background:(!connecting&&tiktokUser)?"linear-gradient(135deg,#fe2c55,#ff6b81)":"#1e1e2e",
                        border:"none",borderRadius:10,padding:"12px 20px",
                        color:(!connecting&&tiktokUser)?"#fff":"#444",
                        fontWeight:700,cursor:(!connecting&&tiktokUser)?"pointer":"not-allowed",fontSize:14}}>
                      {connecting?`Conectando${dots}`:"Conectar"}
                    </button>
                  ):(
                    <button onClick={disconnect}
                      style={{background:"rgba(254,44,85,0.1)",border:"1px solid rgba(254,44,85,0.25)",
                        borderRadius:10,padding:"12px 20px",color:"#fe2c55",
                        fontWeight:700,cursor:"pointer",fontSize:14}}>
                      Desconectar
                    </button>
                  )}
                </div>
                {connecting&&(
                  <div style={{height:3,background:"#1e1e2e",borderRadius:2,marginTop:14,overflow:"hidden"}}>
                    <div className="connecting-fill" style={{height:"100%",width:"50%",
                      background:"linear-gradient(90deg,#25f4ee,#fe2c55)",borderRadius:2}}/>
                  </div>
                )}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12,marginBottom:16}}>
                {[
                  {label:"Espectadores",value:stats.viewers,icon:"👁️",color:"#25f4ee"},
                  {label:"Regalos",value:stats.gifts,icon:"🎁",color:"#fe2c55"},
                  {label:"Seguidores",value:stats.follows,icon:"➕",color:"#ffd700"},
                  {label:"Mensajes",value:stats.messages,icon:"💬",color:"#a78bfa"},
                ].map(s=>(
                  <div key={s.label} style={{background:"#13131a",border:"1px solid #1e1e2e",
                    borderRadius:14,padding:"18px 16px",textAlign:"center"}}>
                    <div style={{fontSize:22,marginBottom:6}}>{s.icon}</div>
                    <div style={{fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:26,color:s.color}}>{s.value.toLocaleString()}</div>
                    <div style={{color:"#444",fontSize:11,marginTop:4,fontWeight:600}}>{s.label}</div>
                  </div>
                ))}
              </div>
              <div style={{background:"#13131a",border:"1px solid #1e1e2e",borderRadius:14,
                padding:"18px 20px",marginBottom:16,display:"flex",alignItems:"center",
                justifyContent:"space-between",position:"relative",overflow:"hidden"}}>
                <div style={{display:"flex",alignItems:"center",gap:14}}>
                  <div className={likeAnim?"heart-pop":""} style={{fontSize:36}}>❤️</div>
                  <div>
                    <div style={{fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:32,
                      color:"#fe2c55",lineHeight:1}}>{stats.likes.toLocaleString()}</div>
                    <div style={{color:"#555",fontSize:12,fontWeight:600,marginTop:4}}>LIKES EN EL LIVE</div>
                  </div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{color:"#333",fontSize:12}}>Por minuto</div>
                  <div style={{color:"#fe2c55",fontWeight:700,fontSize:18}}>{connected?"activo":"--"}</div>
                </div>
                {floatingHearts.map(h=>(
                  <span key={h.id} className="float-heart" style={{left:`${h.x}%`,bottom:10}}>❤️</span>
                ))}
              </div>
              <div style={{background:"#13131a",border:"1px solid #1e1e2e",borderRadius:16,padding:20}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14,marginBottom:14}}>📋 Actividad en tiempo real</div>
                <div style={{background:"#0d0d15",borderRadius:10,padding:14,height:220,overflowY:"auto",display:"flex",flexDirection:"column",gap:6}}>
                  {log.length===0?(
                    <div style={{color:"#333",fontSize:13,textAlign:"center",marginTop:80}}>
                      {connected?"Esperando actividad...":"Conecta tu LIVE para ver la actividad"}
                    </div>
                  ):log.map((item,i)=>(
                    <div key={i} style={{fontSize:12,padding:"7px 10px",borderRadius:7,
                      background:logColor[item.type]||"rgba(255,255,255,0.03)",
                      borderLeft:`2px solid ${logBorder[item.type]||"#333"}`,
                      color:logBorder[item.type]||"#888"}}>
                      {item.text}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {tab==="tts"&&(
            <div className="animate-in">
              <div style={{background:"#13131a",border:"1px solid #1e1e2e",borderRadius:16,padding:20,marginBottom:16}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14,marginBottom:20}}>🔊 Texto a Voz (TTS)</div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24}}>
                  <span style={{color:"#aaa",fontSize:14}}>Activar TTS</span>
                  <Toggle on={ttsOn} onChange={()=>setTtsOn(!ttsOn)}/>
                </div>
                <div style={{marginBottom:20}}>
                  <label style={{display:"block",color:"#666",fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>
                    Voz {loadingVoices && <span style={{color:"#25f4ee"}}>⏳ Cargando...</span>}
                  </label>
                  <select value={ttsVoice} onChange={e=>setTtsVoice(e.target.value)} disabled={!ttsOn}
                    style={{width:"100%",background:"#0d0d15",border:"1px solid #2a2a3a",
                      borderRadius:10,padding:"11px 14px",color:ttsOn?"#fff":"#444",fontSize:14,outline:"none",marginBottom:10}}>
                    {voices.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
                  </select>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
                    background:"rgba(37,244,238,0.05)",border:"1px solid rgba(37,244,238,0.15)",
                    borderRadius:10,padding:"10px 14px",marginBottom:10}}>
                    <div>
                      <div style={{color:"#555",fontSize:11,fontWeight:600}}>VOZ ACTIVA EN EL LIVE</div>
                      <div style={{color:"#25f4ee",fontSize:13,fontWeight:700,marginTop:3}}>
                        {voices.find(v=>v.id===activeVoice)?.name || "Bella (Español Natural)"}
                      </div>
                    </div>
                    <div style={{width:8,height:8,borderRadius:"50%",background:"#25f4ee",boxShadow:"0 0 8px #25f4ee"}} className="live-dot"/>
                  </div>
                  <button onClick={applyVoice} disabled={!ttsOn || ttsVoice===activeVoice}
                    style={{width:"100%",background:(!ttsOn||ttsVoice===activeVoice)?"#1a1a2a":"linear-gradient(135deg,#fe2c55,#ff6b81)",
                      border:"none",borderRadius:10,padding:"12px",
                      color:(!ttsOn||ttsVoice===activeVoice)?"#444":"#fff",
                      fontWeight:700,cursor:(!ttsOn||ttsVoice===activeVoice)?"not-allowed":"pointer",fontSize:14}}>
                    {voiceApplied ? "✅ ¡Voz aplicada!" : ttsVoice===activeVoice ? "✓ Esta voz ya está activa" : "Aplicar voz al LIVE"}
                  </button>
                </div>
                <div style={{marginBottom:24}}>
                  <label style={{display:"block",color:"#666",fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>
                    Volumen: {ttsVol}%
                  </label>
                  <input type="range" min="0" max="100" value={ttsVol}
                    onChange={e=>setTtsVol(Number(e.target.value))} disabled={!ttsOn}
                    style={{width:"100%",accentColor:"#fe2c55"}}/>
                </div>
                <div style={{background:"rgba(37,244,238,0.05)",border:"1px solid rgba(37,244,238,0.15)",
                  borderRadius:10,padding:"14px 16px",color:"#aaa",fontSize:13,lineHeight:1.7,marginBottom:20}}>
                  💡 <strong style={{color:"#25f4ee"}}>¿Cómo funciona?</strong><br/>
                  El TTS lee en voz alta los mensajes, regalos y seguidores usando la voz de ElevenLabs que elijas.
                </div>
              </div>
            </div>
          )}

          {tab==="alerts"&&(
            <div className="animate-in">
              <div style={{background:"#13131a",border:"1px solid #1e1e2e",borderRadius:16,padding:20,marginBottom:16}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14,marginBottom:20}}>🔔 Alertas de Sonido</div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24}}>
                  <span style={{color:"#aaa",fontSize:14}}>Activar alertas</span>
                  <Toggle on={true} onChange={()=>{}}/>
                </div>
                {[
                  {event:"Nuevo seguidor",icon:"➕",color:"#25f4ee"},
                  {event:"Regalo recibido",icon:"🎁",color:"#fe2c55"},
                ].map(item=>(
                  <div key={item.event} style={{display:"flex",alignItems:"center",gap:14,
                    padding:"14px 0",borderBottom:"1px solid #1a1a2a"}}>
                    <div style={{width:38,height:38,borderRadius:10,
                      background:item.color+"15",color:item.color,
                      display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>
                      {item.icon}
                    </div>
                    <span style={{color:"#aaa",fontSize:14,flex:1}}>{item.event}</span>
                    <input type="checkbox" defaultChecked style={{accentColor:"#fe2c55",width:16,height:16}}/>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab==="chat"&&(
            <div className="animate-in">
              <div style={{background:"#13131a",border:"1px solid #1e1e2e",borderRadius:16,padding:20}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14,marginBottom:14}}>💬 Chat Bot Automático</div>
                <div style={{background:"rgba(37,244,238,0.05)",border:"1px solid rgba(37,244,238,0.15)",
                  borderRadius:10,padding:"14px 16px",color:"#aaa",fontSize:13,lineHeight:1.7,marginBottom:20}}>
                  💡 El bot responde automáticamente cuando alguien escribe una palabra clave en tu LIVE.
                </div>
                {[
                  {trigger:"!hola",response:"¡Hola! Bienvenido al LIVE 🎉"},
                  {trigger:"!precio",response:"Revisa el link en mi bio 👆"},
                  {trigger:"!redes",response:"Sígueme en todas mis redes 📱"},
                ].map((cmd,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:10,
                    background:"#0d0d15",borderRadius:10,padding:"12px 14px",marginBottom:10,flexWrap:"wrap"}}>
                    <span style={{color:"#25f4ee",fontWeight:700,fontSize:13,minWidth:70}}>{cmd.trigger}</span>
                    <span style={{color:"#333"}}>→</span>
                    <span style={{color:"#aaa",fontSize:13,flex:1}}>{cmd.response}</span>
                  </div>
                ))}
                <button style={{background:"rgba(254,44,85,0.08)",border:"1px dashed rgba(254,44,85,0.3)",
                  borderRadius:10,padding:"11px 20px",color:"#fe2c55",fontWeight:700,
                  cursor:"pointer",fontSize:13,width:"100%",marginTop:4}}>
                  + Añadir comando
                </button>
              </div>
            </div>
          )}

          {tab==="ranking"&&(
            <div className="animate-in">
              <div style={{background:"#13131a",border:"1px solid #1e1e2e",borderRadius:16,padding:20,marginBottom:16}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
                  <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14}}>🎁 Top Tap Tap (Regalos)</div>
                  <div style={{fontSize:11,color:"#555",fontWeight:600}}>Por diamantes 💎</div>
                </div>
                {tapRanking.length===0?(
                  <div style={{textAlign:"center",padding:"30px 0",color:"#333",fontSize:13}}>
                    {connected?"Esperando regalos...":"Conecta tu LIVE para ver el ranking"}
                  </div>
                ):tapRanking.map((item,i)=>{
                  const medals=["🥇","🥈","🥉","4️⃣","5️⃣"];
                  const colors=["#ffd700","#aaa","#cd7f32","#666","#555"];
                  const maxDiamonds=tapRanking[0]?.diamonds||1;
                  const pct=Math.round((item.diamonds/maxDiamonds)*100);
                  return(
                    <div key={item.user} style={{marginBottom:14}}>
                      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                        <span style={{fontSize:20}}>{medals[i]}</span>
                        <div style={{flex:1}}>
                          <div style={{display:"flex",justifyContent:"space-between"}}>
                            <span style={{color:"#fff",fontSize:13,fontWeight:700}}>@{item.nickname}</span>
                            <span style={{color:colors[i],fontWeight:800,fontSize:13}}>💎 {item.diamonds.toLocaleString()}</span>
                          </div>
                          <div style={{height:6,background:"#1a1a2a",borderRadius:3,marginTop:6,overflow:"hidden"}}>
                            <div style={{height:"100%",width:`${pct}%`,borderRadius:3,
                              background:i===0?"linear-gradient(90deg,#ffd700,#ffaa00)":i===1?"linear-gradient(90deg,#aaa,#888)":i===2?"linear-gradient(90deg,#cd7f32,#a0522d)":"#2a2a3a"}}/>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div style={{background:"#13131a",border:"1px solid #1e1e2e",borderRadius:16,padding:20}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
                  <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14}}>❤️ Top Likes del LIVE</div>
                  <div style={{fontSize:11,color:"#555",fontWeight:600}}>Tiempo real</div>
                </div>
                {likeRanking.length===0?(
                  <div style={{textAlign:"center",padding:"30px 0",color:"#333",fontSize:13}}>
                    {connected?"Esperando likes...":"Conecta tu LIVE para ver el ranking"}
                  </div>
                ):likeRanking.map((item,i)=>{
                  const medals=["🥇","🥈","🥉","4️⃣","5️⃣"];
                  const maxLikes=likeRanking[0]?.count||1;
                  const pct=Math.round((item.count/maxLikes)*100);
                  return(
                    <div key={item.user} style={{marginBottom:14}}>
                      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                        <span style={{fontSize:20}}>{medals[i]}</span>
                        <div style={{flex:1}}>
                          <div style={{display:"flex",justifyContent:"space-between"}}>
                            <span style={{color:"#fff",fontSize:13,fontWeight:700}}>@{item.nickname}</span>
                            <span style={{color:"#fe2c55",fontWeight:800,fontSize:13}}>❤️ {item.count.toLocaleString()}</span>
                          </div>
                          <div style={{height:6,background:"#1a1a2a",borderRadius:3,marginTop:6}}>
                            <div style={{height:"100%",width:`${pct}%`,borderRadius:3,
                              background:"linear-gradient(90deg,#fe2c55,#ff6b81)"}}/>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
