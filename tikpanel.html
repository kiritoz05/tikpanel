.tbl-row.dis{opacity:0.4}
.th{color:#3a3a5a;font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase}

.bg{background:rgba(254,44,85,0.1);color:#fe2c55;border:1px solid rgba(254,44,85,0.2)}
.bl{background:rgba(245,197,24,0.1);color:#f5c518;border:1px solid rgba(245,197,24,0.2)}

.bsh{background:rgba(255,255,255,0.06);color:#888;border:1px solid rgba(255,255,255,0.1)}

.uarea{background:#0d0d15;border:1.5px dashed #2a2a3a;border-radius:10px;padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.uarea:hover,.uarea.has{border-color:#25f4ee;background:rgba(37,244,238,0.03)}
.uarea.has{border-style:solid}
.uarea input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
/* Itoggle */
.itog{width:30px;height:17px;border-radius:9px;cursor:pointer;position:relative;border:none;flex-shrink:0;background:#2a2a3a;transition:background 0.2s}

// ElevenLabs TTS
async function speakEL(text, voiceId, vol=0.8){
  try{
    const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`,{
      method:"POST",
      headers:{"xi-api-key":EL_KEY,"Content-Type":"application/json","Accept":"audio/mpeg"},
      body:JSON.stringify({text,model_id:"eleven_multilingual_v2",voice_settings:{stability:0.5,similarity_boost:0.75}})
    });
    if(!r.ok) throw new Error("EL error "+r.status);
    const blob=await r.blob();
    const audio=new Audio(URL.createObjectURL(blob));
    audio.volume=vol; await audio.play();
  }catch(e){console.error("TTS:",e.message);}
}

  useEffect(()=>{
    setLoadingV(true);
    fetch("https://api.elevenlabs.io/v1/voices",{headers:{"xi-api-key":EL_KEY}})
      .then(r=>r.json()).then(d=>{
        if(d.voices?.length){ const m=d.voices.map(v=>({id:v.voice_id,name:v.name})); setAllVoices([...VOICES,...m.filter(v=>!VOICES.find(x=>x.id===v.id))]); }
      }).catch(()=>{}).finally(()=>setLoadingV(false));
  },[]);

  // Toast
  const showToast=(msg)=>{ setToast(msg); setTimeout(()=>setToast(""),2500); };

  // ── Disparar acción ──────────────────────────────────────
  const fireAction=useCallback(async(eventType,giftName="",nickname="",giftCount=1)=>{
    if(!alertsOnRef.current) return;
    const acts=actionsRef.current.filter(a=>a.enabled&&a.event===eventType);
    for(const act of acts){
      if(act.event==="Gift Alert"){
        if(act.giftName!=="Cualquier regalo"&&!giftName.toLowerCase().includes(act.giftName.toLowerCase())) continue;
        if(giftCount<act.minCount) continue;
      }
      if(act.soundUrl){ try{ const a=new Audio(act.soundUrl); a.volume=ttsVolRef.current/100; a.play(); }catch(e){} }
      if(act.ttsOn&&act.ttsText&&ttsOnRef.current){
        const text=act.ttsText.replace(/@usuario/gi,nickname);
        await speakEL(text,activeVRef.current,ttsVolRef.current/100);
      }
    }
  },[]);

  // ── Socket ───────────────────────────────────────────────
  useEffect(()=>{
    const sock=io(SERVER_URL,{transports:["websocket"]});
    sock.on("event",async d=>{
      if(d.type==="chat"){
        setLog(p=>[{t:"msg",tx:`💬 @${d.user}: ${d.comment}`},...p].slice(0,30));
        setStats(p=>({...p,messages:p.messages+1}));
        if(ttsOnRef.current){ speakEL(`${d.nickname||d.user} dice: ${d.comment}`,activeVRef.current,ttsVolRef.current/100); }
      } else if(d.type==="gift"){
        setLog(p=>[{t:"gift",tx:`🎁 @${d.nickname} envió ${d.giftCount}x ${d.giftName}`},...p].slice(0,30));
        setStats(p=>({...p,gifts:p.gifts+1}));
        const dm=d.diamondCount||0;
        setTotalDiamonds(p=>p+dm);
        setTapRank(prev=>{ const ex=prev.find(u=>u.user===d.user); const upd=ex?prev.map(u=>u.user===d.user?{...u,diamonds:u.diamonds+dm,gifts:u.gifts+1}:u):[...prev,{user:d.user,nickname:d.nickname||d.user,diamonds:dm,gifts:1}]; return upd.sort((a,b)=>b.diamonds-a.diamonds).slice(0,5); });
        fireAction("Gift Alert",d.giftName,d.nickname,d.giftCount);
      } else if(d.type==="follow"){
        setLog(p=>[{t:"follow",tx:`➕ @${d.user} te siguió`},...p].slice(0,30));
        setStats(p=>({...p,follows:p.follows+1}));
        fireAction("Follow Alert","",d.nickname||d.user);
      } else if(d.type==="like"){
        const lc=d.likeCount||1;
        setLog(p=>[{t:"like",tx:`❤️ @${d.user} dio ${lc} likes`},...p].slice(0,30));
        setStats(p=>({...p,likes:p.likes+lc})); setTotalLikes(p=>p+lc);
        setLikeAnim(true); setTimeout(()=>setLikeAnim(false),300);
        const hid=Date.now();
        setFloatHearts(p=>[...p,{id:hid,x:Math.random()*60+20}]);
        setTimeout(()=>setFloatHearts(p=>p.filter(h=>h.id!==hid)),1000);
        setLikeRank(prev=>{ const ex=prev.find(u=>u.user===d.user); const upd=ex?prev.map(u=>u.user===d.user?{...u,count:u.count+lc}:u):[...prev,{user:d.user,nickname:d.user,count:lc}]; return upd.sort((a,b)=>b.count-a.count).slice(0,5); });
        fireAction("Like Alert","",d.user);
      }
    });
    sock.on("viewers",d=>setStats(p=>({...p,viewers:d.count})));
    sock.on("disconnected",()=>setConnected(false));
    sock.on("error",d=>setLog(p=>[{t:"sys",tx:`⚠️ ${d.message}`},...p]));
    return()=>sock.disconnect();
  },[fireAction]);

  useEffect(()=>{ if(!connecting) return; const t=setInterval(()=>setDots(d=>d.length>=3?"":d+"."),400); return()=>clearInterval(t); },[connecting]);

  const applyVoice=()=>{ activeVRef.current=ttsVoice; setActiveV(ttsVoice); sv("ttsVoice",ttsVoice); setVApplied(true); setTimeout(()=>setVApplied(false),2500); fetch(`${SERVER_URL}/setvoice`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({voiceId:ttsVoice})}).catch(()=>{}); };

  const connect=async()=>{
    if(!tiktokUser.trim()) return;
    setConnecting(true);
    try{
      const r=await fetch(`${SERVER_URL}/connect`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:tiktokUser})});
      const d=await r.json();
      if(d.success){ setConnecting(false); setConnected(true); setStats({viewers:0,gifts:0,follows:0,messages:0,likes:0}); setTotalDiamonds(0); setTotalLikes(0); setTapRank([]); setLikeRank([]); setLog([{t:"sys",tx:`✅ Conectado a @${tiktokUser}`}]); }
      else{ setConnecting(false); setLog([{t:"sys",tx:`⚠️ ${d.error||"No se pudo conectar. ¿Estás en LIVE?"}`}]); }
    }catch(e){ setConnecting(false); setLog([{t:"sys",tx:"⚠️ Error al conectar"}]); }
  };

  const disconnect=async()=>{ await fetch(`${SERVER_URL}/disconnect`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:tiktokUser})}).catch(()=>{}); setConnected(false); setLog([]); setStats({viewers:0,gifts:0,follows:0,messages:0,likes:0}); setTotalDiamonds(0); setTotalLikes(0); };

  const logout=()=>{ clr(); setUser(null); };

  if(!user) return <Login onLogin={u=>{sv("session",u);setUser(u);}}/>;

  const TABS=[{id:"dashboard",icon:"⚡",label:"Dashboard"},{id:"acciones",icon:"🎬",label:"Acciones"},{id:"tts",icon:"🔊",label:"TTS"},{id:"ranking",icon:"🏆",label:"Ranking"},{id:"chat",icon:"💬",label:"Chat Bot"}];

  const LC={gift:"rgba(254,44,85,0.1)",follow:"rgba(37,244,238,0.1)",msg:"rgba(255,255,255,0.03)",like:"rgba(254,44,85,0.06)",sys:"rgba(37,244,238,0.07)"};
  const LB={gift:"#fe2c55",follow:"#25f4ee",msg:"#2a2a3a",like:"#fe2c55",sys:"#25f4ee"};

  const badgeCls=ev=>ev.startsWith("Follow")?"bf":ev.startsWith("Gift")?"bg":ev.startsWith("Like")?"bl":ev.startsWith("Sub")?"bs":"bsh";
  const badgeIcon=ev=>ev.startsWith("Follow")?"➕":ev.startsWith("Gift")?"🎁":ev.startsWith("Like")?"❤️":ev.startsWith("Sub")?"⭐":"📤";

  const saveAction=(form)=>{
    if(form.id&&actions.find(a=>a.id===form.id)){ setActions(p=>p.map(a=>a.id===form.id?form:a)); showToast("✅ Acción actualizada"); }
    else{ setActions(p=>[...p,{...form,id:Date.now()}]); showToast("✅ Acción creada"); }
    setShowModal(false); setEditAct(null);
  };

  const testAction=async(act)=>{
    if(act.soundUrl){ try{ const a=new Audio(act.soundUrl); a.volume=ttsVolRef.current/100; a.play(); }catch(e){} }
    if(act.ttsOn&&act.ttsText){ await speakEL(act.ttsText.replace(/@usuario/gi,"UsuarioPrueba"),activeVRef.current,ttsVolRef.current/100); }
    showToast(`▶ Probando: ${act.name}`);
  };

  const card={background:"#13131a",border:"1px solid #1e1e2e",borderRadius:16,padding:18,marginBottom:14};
  const lbl={display:"block",color:"#555",fontSize:11,fontWeight:600,letterSpacing:0.8,textTransform:"uppercase",marginBottom:7};
  const inp={width:"100%",background:"#0a0a0f",border:"1px solid #2a2a3a",borderRadius:10,padding:"11px 14px",color:"#fff",fontSize:14,outline:"none"};

  const filteredActions=actions.filter(a=>a.name.toLowerCase().includes(searchQ.toLowerCase()));

  return <div style={{display:"flex",minHeight:"100vh",background:"#0a0a0f"}}>
    {showModal&&<ActionModal action={editAct} voiceId={activeVRef.current} vol={ttsVol} onSave={saveAction} onClose={()=>{setShowModal(false);setEditAct(null);}}/>}
    {toast&&<div className="toast">{toast}</div>}
    {sidebar&&<div onClick={()=>setSidebar(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:40}}/>}

    {/* Sidebar */}
    <div style={{width:225,background:"#0d0d18",borderRight:"1px solid #1a1a2a",display:"flex",flexDirection:"column",padding:"16px 12px",position:"fixed",top:0,bottom:0,left:0,zIndex:50,transform:sidebar?"translateX(0)":"translateX(-100%)",transition:"transform 0.3s ease"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16,paddingLeft:4}}>
        <div style={{width:30,height:30,borderRadius:8,background:"linear-gradient(135deg,#fe2c55,#25f4ee)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:15}}>T</div>
        <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18,letterSpacing:-0.5}}>ik<span style={{color:"#fe2c55"}}>Panel</span></span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8,background:"#1a1a28",borderRadius:10,padding:"9px 11px",marginBottom:10}}>
        <div style={{width:30,height:30,borderRadius:"50%",flexShrink:0,background:"linear-gradient(135deg,#fe2c55,#25f4ee)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:13}}>{user.avatar}</div>
        <div style={{overflow:"hidden"}}><div style={{fontSize:12,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{user.name}</div><div style={{fontSize:10,color:"#fe2c55",fontWeight:600,marginTop:1}}>{user.plan}</div></div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:6,background:connected?"rgba(37,244,238,0.05)":"rgba(255,255,255,0.02)",border:`1px solid ${connected?"rgba(37,244,238,0.2)":"#1a1a2a"}`,borderRadius:20,padding:"5px 10px",fontSize:11,color:connected?"#25f4ee":"#444",marginBottom:14,overflow:"hidden"}}>
        <div className={connected?"live-dot":""} style={{width:6,height:6,borderRadius:"50%",flexShrink:0,background:connected?"#25f4ee":"#2a2a3a",boxShadow:connected?"0 0 8px #25f4ee":"none"}}/>
        <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{connected?`@${tiktokUser}`:"Sin conexión"}</span>
      </div>
      <nav style={{display:"flex",flexDirection:"column",gap:2,flex:1}}>
        {TABS.map(t=><button key={t.id} onClick={()=>{setTab(t.id);setSidebar(false);}} style={{display:"flex",alignItems:"center",gap:9,background:tab===t.id?"rgba(254,44,85,0.1)":"transparent",border:tab===t.id?"1px solid rgba(254,44,85,0.18)":"1px solid transparent",borderRadius:9,padding:"10px 10px",color:tab===t.id?"#fff":"#555",cursor:"pointer",fontSize:12,fontWeight:tab===t.id?700:500,textAlign:"left"}}><span style={{fontSize:15}}>{t.icon}</span>{t.label}</button>)}
      </nav>
      <button onClick={logout} style={{background:"transparent",border:"1px solid #1a1a2a",borderRadius:9,padding:"8px 10px",color:"#444",cursor:"pointer",fontSize:12,marginTop:6}}>Cerrar sesión</button>
    </div>

    {/* Main */}
    <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",borderBottom:"1px solid #1a1a2a",background:"#0a0a0f",position:"sticky",top:0,zIndex:30}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={()=>setSidebar(!sidebar)} style={{background:"#1a1a28",border:"1px solid #2a2a3a",borderRadius:7,width:33,height:33,cursor:"pointer",color:"#fff",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>☰</button>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:15}}>{TABS.find(t=>t.id===tab)?.icon} {TABS.find(t=>t.id===tab)?.label}</div>
        </div>
        {connected&&<div style={{display:"flex",alignItems:"center",gap:5,background:"rgba(254,44,85,0.1)",border:"1px solid rgba(254,44,85,0.25)",borderRadius:20,padding:"4px 11px",color:"#fe2c55",fontWeight:800,fontSize:10,letterSpacing:1}}>
          <div className="live-dot" style={{width:6,height:6,borderRadius:"50%",background:"#fe2c55",boxShadow:"0 0 8px #fe2c55"}}/>EN VIVO
        </div>}
      </div>

      <div style={{padding:14,flex:1,overflowY:"auto"}}>

        {/* ── DASHBOARD ── */}
        {tab==="dashboard"&&<div className="animate-in">
          <div style={card}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,marginBottom:12}}>🎯 Conectar al LIVE</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <div style={{display:"flex",alignItems:"center",flex:1,minWidth:130,background:"#0d0d15",border:"1px solid #2a2a3a",borderRadius:10,overflow:"hidden"}}>
                <span style={{color:"#fe2c55",fontWeight:800,padding:"0 10px",fontSize:15,flexShrink:0}}>@</span>
                <input value={tiktokUser} onChange={e=>setTiktokUser(e.target.value)} placeholder="usuario_tiktok" disabled={connected||connecting} style={{flex:1,background:"transparent",border:"none",padding:"11px 6px 11px 0",color:"#fff",fontSize:13,outline:"none",minWidth:0}}/>
              </div>
              {!connected
                ?<button onClick={connect} disabled={connecting||!tiktokUser} style={{background:(!connecting&&tiktokUser)?"linear-gradient(135deg,#fe2c55,#ff6b81)":"#1e1e2e",border:"none",borderRadius:10,padding:"11px 16px",color:(!connecting&&tiktokUser)?"#fff":"#444",fontWeight:700,cursor:(!connecting&&tiktokUser)?"pointer":"not-allowed",fontSize:13,whiteSpace:"nowrap"}}>{connecting?`Conectando${dots}`:"Conectar"}</button>
                :<button onClick={disconnect} style={{background:"rgba(254,44,85,0.1)",border:"1px solid rgba(254,44,85,0.3)",borderRadius:10,padding:"11px 16px",color:"#fe2c55",fontWeight:700,cursor:"pointer",fontSize:13,whiteSpace:"nowrap"}}>Desconectar</button>
              }
            </div>
            {connecting&&<div style={{height:3,background:"#1e1e2e",borderRadius:2,marginTop:10,overflow:"hidden"}}><div className="cf" style={{height:"100%",width:"50%",background:"linear-gradient(90deg,#25f4ee,#fe2c55)",borderRadius:2}}/></div>}
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:14}}>
            {[{label:"Espectadores",value:stats.viewers,icon:"👁️",color:"#25f4ee"},{label:"Regalos",value:stats.gifts,icon:"🎁",color:"#fe2c55"},{label:"Seguidores",value:stats.follows,icon:"➕",color:"#ffd700"},{label:"Mensajes",value:stats.messages,icon:"💬",color:"#a78bfa"}].map(s=><div key={s.label} style={{background:"#13131a",border:"1px solid #1e1e2e",borderRadius:13,padding:14,textAlign:"center"}}>
              <div style={{fontSize:20,marginBottom:5}}>{s.icon}</div>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:22,color:s.color}}>{s.value.toLocaleString()}</div>
              <div style={{color:"#444",fontSize:10,marginTop:3,fontWeight:600}}>{s.label}</div>
            </div>)}
          </div>

          <div style={{...card,display:"flex",alignItems:"center",justifyContent:"space-between",position:"relative",overflow:"hidden"}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div className={likeAnim?"hp":""} style={{fontSize:30}}>❤️</div>
              <div>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:28,color:"#fe2c55",lineHeight:1}}>{stats.likes.toLocaleString()}</div>
                <div style={{color:"#555",fontSize:10,fontWeight:600,marginTop:2}}>LIKES EN EL LIVE</div>
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{color:"#333",fontSize:10}}>💎 Diamantes</div>
              <div style={{color:"#ffd700",fontWeight:800,fontSize:16}}>{totalDiamonds.toLocaleString()}</div>
            </div>
            {floatHearts.map(h=><span key={h.id} className="fh" style={{left:`${h.x}%`,bottom:6}}>❤️</span>)}
          </div>

          <div style={card}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,marginBottom:10}}>📋 Actividad en tiempo real</div>
            <div style={{background:"#0d0d15",borderRadius:10,padding:10,height:210,overflowY:"auto",display:"flex",flexDirection:"column",gap:4}}>
              {log.length===0?<div style={{color:"#333",fontSize:12,textAlign:"center",marginTop:80}}>{connected?"Esperando actividad...":"Conecta tu LIVE"}</div>
                :log.map((item,i)=><div key={i} style={{fontSize:11,padding:"5px 9px",borderRadius:6,background:LC[item.t]||"rgba(255,255,255,0.03)",borderLeft:`2px solid ${LB[item.t]||"#333"}`,color:LB[item.t]||"#888"}}>{item.tx}</div>)}
            </div>
          </div>
        </div>}

        {/* ── ACCIONES (estilo TikFinity) ── */}
        {tab==="acciones"&&<div className="animate-in">
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
            <button onClick={()=>{setEditAct(null);setShowModal(true);}} style={{background:"linear-gradient(135deg,#fe2c55,#ff6b81)",border:"none",borderRadius:9,padding:"9px 16px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>+ Crear nueva Acción</button>
            <div style={{display:"flex",alignItems:"center",gap:7,background:"#13131a",border:"1px solid #1e1e2e",borderRadius:20,padding:"6px 14px",cursor:"pointer"}} onClick={()=>setAlertsOn(!alertsOn)}>
              <div style={{width:8,height:8,borderRadius:"50%",background:alertsOn?"#25f4ee":"#444",boxShadow:alertsOn?"0 0 8px #25f4ee":"none"}} className={alertsOn?"live-dot":""}/>
              <span style={{fontSize:12,fontWeight:700,color:alertsOn?"#25f4ee":"#555"}}>{alertsOn?"Habilitado":"Deshabilitado"}</span>
            </div>
            <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="🔍 Buscar..." style={{flex:1,minWidth:120,background:"#13131a",border:"1px solid #1e1e2e",borderRadius:9,padding:"8px 12px",color:"#fff",fontSize:12,outline:"none"}}/>
          </div>

          <div style={{background:"#13131a",border:"1px solid #1e1e2e",borderRadius:16,overflow:"hidden"}}>
            <div className="tbl-head">
              <div className="th"></div>
              <div className="th">Nombre</div>
              <div className="th">Evento</div>
              <div className="th">Dur.</div>
              <div className="th">Sonido</div>
              <div className="th">TTS</div>
              <div className="th"></div>
            </div>

            {filteredActions.length===0&&<div style={{textAlign:"center",padding:"40px 20px",color:"#333",fontSize:13}}>
              {searchQ?"Sin resultados":"Crea tu primera acción ↑"}
            </div>}

            {filteredActions.map((act,i)=><div key={act.id} className={`tbl-row ${act.enabled?"":"dis"}`}>
              <button className={`itog ${act.enabled?"on":""}`} onClick={()=>setActions(p=>p.map(a=>a.id===act.id?{...a,enabled:!a.enabled}:a))}/>
              <div>
                <div style={{color:act.enabled?"#fff":"#666",fontSize:12,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{act.name}</div>
                <div style={{fontSize:10,color:"#444",marginTop:2,fontFamily:"'JetBrains Mono',monospace"}}>
                  {act.event==="Gift Alert"?`🎁 ${act.giftName} ×${act.minCount}`:act.event}
                </div>
              </div>
              <div><span className={`badge ${badgeCls(act.event)}`}>{badgeIcon(act.event)} {act.event.replace(" Alert","")}</span></div>
              <div style={{fontSize:11,color:"#555",fontFamily:"'JetBrains Mono',monospace"}}>{act.duration}s</div>
              <div style={{textAlign:"center",fontSize:15}}>{act.soundName?<span style={{color:"#25f4ee"}}>🎵</span>:<span style={{color:"#2a2a3a"}}>—</span>}</div>
              <div style={{textAlign:"center",fontSize:13}}>{act.ttsOn&&act.ttsText?<span style={{color:"#25f4ee"}}>🔊</span>:<span style={{color:"#2a2a3a"}}>—</span>}</div>
              <div style={{display:"flex",gap:4,justifyContent:"flex-end"}}>
                {[{cls:"play",icon:"▶",fn:()=>testAction(act),color:"#25f4ee"},
                  {cls:"edit",icon:"✏️",fn:()=>{setEditAct(act);setShowModal(true);},color:"#aaa"},
                  {cls:"del", icon:"🗑️",fn:()=>{ if(confirm(`¿Eliminar "${act.name}"?`)){ setActions(p=>p.filter(a=>a.id!==act.id)); showToast("🗑️ Eliminada"); } },color:"#fe2c55"}
                ].map(b=><button key={b.cls} onClick={b.fn} style={{background:"transparent",border:"1px solid #1e1e2e",borderRadius:6,width:25,height:25,cursor:"pointer",color:b.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11}}>{b.icon}</button>)}
              </div>
            </div>)}
          </div>

          <div style={{background:"rgba(254,44,85,0.04)",border:"1px solid rgba(254,44,85,0.12)",borderRadius:10,padding:"11px 14px",color:"#555",fontSize:11,lineHeight:1.7,marginTop:12}}>
            ⚠️ Los sonidos MP3 se pierden al recargar la página — vuelve a subirlos. El TTS usa ElevenLabs con la voz configurada en la pestaña TTS.
          </div>
        </div>}

        {/* ── TTS ── */}
        {tab==="tts"&&<div className="animate-in">
          <div style={card}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,marginBottom:16}}>🔊 Texto a Voz (ElevenLabs)</div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
              <span style={{color:"#aaa",fontSize:14}}>Activar TTS global</span>
              <Toggle on={ttsOn} onChange={()=>setTtsOn(!ttsOn)}/>
            </div>
            <div style={{marginBottom:10}}>
              <label style={lbl}>Seleccionar voz {loadingV&&<span style={{color:"#25f4ee"}}>⏳</span>}</label>
              <select value={ttsVoice} onChange={e=>setTtsVoice(e.target.value)} disabled={!ttsOn} style={{...inp,cursor:"pointer",marginBottom:10}}>
                {allVoices.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
              </select>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(37,244,238,0.05)",border:"1px solid rgba(37,244,238,0.15)",borderRadius:10,padding:"10px 14px",marginBottom:10}}>
                <div><div style={{color:"#444",fontSize:10,fontWeight:600,letterSpacing:0.5}}>VOZ ACTIVA EN EL LIVE</div><div style={{color:"#25f4ee",fontSize:13,fontWeight:700,marginTop:2}}>{allVoices.find(v=>v.id===activeV)?.name||"Bella"}</div></div>
                <div className="live-dot" style={{width:8,height:8,borderRadius:"50%",background:"#25f4ee",boxShadow:"0 0 8px #25f4ee"}}/>
              </div>
              <button onClick={applyVoice} disabled={!ttsOn} style={{width:"100%",background:!ttsOn?"#1a1a2a":ttsVoice===activeV?"rgba(37,244,238,0.1)":"linear-gradient(135deg,#fe2c55,#ff6b81)",border:ttsVoice===activeV?"1px solid rgba(37,244,238,0.3)":"none",borderRadius:10,padding:"12px",color:!ttsOn?"#444":ttsVoice===activeV?"#25f4ee":"#fff",fontWeight:700,cursor:!ttsOn?"not-allowed":"pointer",fontSize:14,marginBottom:18}}>
                {vApplied?"✅ ¡Voz aplicada!":ttsVoice===activeV?"✓ Esta voz ya está activa":"🎙️ Aplicar voz al LIVE"}
              </button>
            </div>
            <div style={{marginBottom:16}}>
              <label style={lbl}>Volumen: {ttsVol}%</label>
              <input type="range" min="0" max="100" value={ttsVol} onChange={e=>setTtsVol(Number(e.target.value))} style={{width:"100%",accentColor:"#fe2c55"}}/>
            </div>
            <div style={{background:"rgba(37,244,238,0.04)",border:"1px solid rgba(37,244,238,0.1)",borderRadius:10,padding:"11px 14px",color:"#555",fontSize:12,lineHeight:1.7}}>
              💡 Los mensajes personalizados por regalo se configuran en <strong style={{color:"#fe2c55"}}>Acciones</strong>. El TTS de comentarios del chat se activa automáticamente aquí.
            </div>
          </div>
          <div style={card}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,marginBottom:12}}>🎤 Probar voz activa</div>
            <input id="ttsT" placeholder="Escribe algo para probar..." style={{...inp,marginBottom:10}}/>
            <button disabled={!ttsOn} onClick={async()=>{ const t=document.getElementById("ttsT").value||"Hola, esto es TikPanel con ElevenLabs"; await speakEL(t,activeVRef.current,ttsVol/100); }}
              style={{width:"100%",background:ttsOn?"rgba(254,44,85,0.1)":"transparent",border:"1px solid rgba(254,44,85,0.2)",borderRadius:10,padding:"11px",color:ttsOn?"#fe2c55":"#333",fontWeight:700,cursor:ttsOn?"pointer":"not-allowed",fontSize:13}}>
              ▶ Reproducir con voz activa
            </button>
          </div>
        </div>}

        {/* ── RANKING ── */}
        {tab==="ranking"&&<div className="animate-in">
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
            {[{icon:"💎",val:totalDiamonds,label:"DIAMANTES TOTALES",color:"#ffd700"},{icon:"❤️",val:totalLikes,label:"LIKES TOTALES",color:"#fe2c55"}].map(s=><div key={s.label} style={{background:"#13131a",border:"1px solid #1e1e2e",borderRadius:13,padding:14,textAlign:"center"}}>
              <div style={{fontSize:20,marginBottom:5}}>{s.icon}</div>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:22,color:s.color}}>{s.val.toLocaleString()}</div>
              <div style={{color:"#444",fontSize:10,fontWeight:600,marginTop:3}}>{s.label}</div>
            </div>)}
          </div>
          {[{title:"🎁 Top Tap Tap",data:tapRank,key:"diamonds",color:"#ffd700",icon:"💎",empty:"Esperando regalos..."},
            {title:"❤️ Top Likes",  data:likeRank,key:"count",   color:"#fe2c55",icon:"❤️",empty:"Esperando likes..."}
          ].map(({title,data,key,color,icon,empty})=><div key={title} style={card}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,marginBottom:14}}>{title}</div>
            {data.length===0?<div style={{textAlign:"center",padding:"20px 0",color:"#333",fontSize:12}}>{connected?empty:"Conecta tu LIVE"}</div>
              :data.map((item,i)=>{
                const medals=["🥇","🥈","🥉","4️⃣","5️⃣"];
                const max=data[0][key]||1; const pct=Math.round((item[key]/max)*100);
                return <div key={item.user} style={{marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <span style={{fontSize:16,flexShrink:0}}>{medals[i]}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <span style={{color:"#fff",fontSize:12,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>@{item.nickname}</span>
                        <span style={{color,fontWeight:800,fontSize:12,flexShrink:0,marginLeft:8}}>{icon} {item[key].toLocaleString()}</span>
                      </div>
                      <div style={{height:4,background:"#1a1a2a",borderRadius:2,marginTop:4,overflow:"hidden"}}>
                        <div style={{height:"100%",width:`${pct}%`,borderRadius:2,transition:"width 0.5s",background:key==="count"?"linear-gradient(90deg,#fe2c55,#ff6b81)":i===0?"linear-gradient(90deg,#ffd700,#ffaa00)":i===1?"linear-gradient(90deg,#ccc,#888)":i===2?"linear-gradient(90deg,#cd7f32,#a05)":"#2a2a3a"}}/>
                      </div>
                    </div>
                  </div>
                </div>;
              })}
          </div>)}
        </div>}

        {/* ── CHAT BOT ── */}
        {tab==="chat"&&<div className="animate-in">
          <div style={card}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,marginBottom:12}}>💬 Chat Bot Automático</div>
            <div style={{background:"rgba(37,244,238,0.04)",border:"1px solid rgba(37,244,238,0.1)",borderRadius:10,padding:"11px 13px",color:"#555",fontSize:12,lineHeight:1.7,marginBottom:14}}>
              💡 El bot responde automáticamente cuando alguien escribe una palabra clave en tu LIVE.
            </div>
            {[{trigger:"!hola",response:"¡Hola! Bienvenido al LIVE de Luz Álva 🎉"},{trigger:"!precio",response:"Revisa el link en mi bio 👆"},{trigger:"!redes",response:"Sígueme en todas mis redes 📱"}].map((cmd,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:10,background:"#0d0d15",borderRadius:9,padding:"11px 13px",marginBottom:8}}>
              <span style={{color:"#25f4ee",fontWeight:700,fontSize:12,minWidth:60,fontFamily:"'JetBrains Mono',monospace"}}>{cmd.trigger}</span>
              <span style={{color:"#333"}}>→</span>
              <span style={{color:"#555",fontSize:12,flex:1}}>{cmd.response}</span>
            </div>)}
            <button style={{background:"rgba(254,44,85,0.08)",border:"1px dashed rgba(254,44,85,0.3)",borderRadius:9,padding:"10px",color:"#fe2c55",fontWeight:700,cursor:"pointer",fontSize:13,width:"100%",marginTop:2}}>+ Añadir comando</button>
          </div>
        </div>}

      </div>
    </div>
  </div>;
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
