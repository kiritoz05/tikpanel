/* ── TTS — una sola función, cola para evitar solapamiento ─ */
const ttsQueue=[];
let ttsPlaying=false;
async function enqueueTTS(text,voiceId,vol){
  ttsQueue.push({text,voiceId,vol});
  if(!ttsPlaying) processQueue();
}
async function processQueue(){
  if(ttsQueue.length===0){ttsPlaying=false;return;}
  ttsPlaying=true;
  const {text,voiceId,vol}=ttsQueue.shift();
  try{
    const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`,{
      method:"POST",
      headers:{"xi-api-key":EL_KEY,"Content-Type":"application/json","Accept":"audio/mpeg"},
      body:JSON.stringify({text,model_id:"eleven_multilingual_v2",voice_settings:{stability:0.5,similarity_boost:0.75}})
    });
    if(!r.ok) throw new Error("EL "+r.status);
    const blob=await r.blob();
    const audio=new Audio(URL.createObjectURL(blob));
    audio.volume=vol;
    await new Promise(res=>{audio.onended=res;audio.onerror=res;audio.play();});
  }catch(e){console.error("TTS:",e.message);}
  processQueue();
}

    setLdV(true);
    fetch("https://api.elevenlabs.io/v1/voices",{headers:{"xi-api-key":EL_KEY}})
      .then(r=>r.json()).then(d=>{if(d.voices?.length){const m=d.voices.map(v=>({id:v.voice_id,name:v.name}));setVoices([...DEF_VOICES,...m.filter(v=>!DEF_VOICES.find(x=>x.id===v.id))]);} }).catch(()=>{}).finally(()=>setLdV(false));
  },[]);

  const showT=(msg)=>{setToast(msg);setTimeout(()=>setToast(""),2500);};

  // ── Disparar acción ────────────────────────────────────
  const fireAction=useCallback(async(eventType,giftName="",nickname="",giftCount=1)=>{
    if(!alertsOnR.current) return;
    const acts=actsR.current.filter(a=>a.enabled&&a.event===eventType);
    for(const act of acts){
      if(act.event==="Gift Alert"){
        const gn=(giftName||"").toLowerCase();
        const an=(act.giftName||"").toLowerCase();
        if(an!=="cualquier regalo"&&!gn.includes(an)&&!an.includes(gn)) continue;
        if(giftCount<act.minCount) continue;
      }
      // Sonido MP3
      if(act.soundUrl){try{const a=new Audio(act.soundUrl);a.volume=ttsVolR.current/100;a.play();}catch(e){}}
      // TTS — usando cola, sin duplicados
      if(act.ttsOn&&act.ttsText&&ttsOnR.current){
        const text=act.ttsText.replace(/@usuario/gi,nickname);
        enqueueTTS(text,actVR.current,ttsVolR.current/100);
      }
    }
  },[]);

  // ── Socket ─────────────────────────────────────────────
  useEffect(()=>{
    const sock=io(SERVER,{transports:["websocket"]});
    sock.on("event",async d=>{
      if(d.type==="chat"){
        setLog(p=>[{t:"msg",tx:`💬 @${d.user}: ${d.comment}`},...p].slice(0,30));
        setStats(p=>({...p,messages:p.messages+1}));
        // TTS comentarios solo si NO hay ninguna acción de chat activa
        if(ttsOnR.current){
          enqueueTTS(`${d.nickname||d.user} dice: ${d.comment}`,actVR.current,ttsVolR.current/100);
        }
      } else if(d.type==="gift"){
        setLog(p=>[{t:"gift",tx:`🎁 @${d.nickname} → ${d.giftCount}x ${d.giftName}`},...p].slice(0,30));
        setStats(p=>({...p,gifts:p.gifts+1}));
        const dm=d.diamondCount||0;
        setTotDia(p=>p+dm);
        setTapR(prev=>{const ex=prev.find(u=>u.user===d.user);const upd=ex?prev.map(u=>u.user===d.user?{...u,diamonds:u.diamonds+dm,gifts:u.gifts+1}:u):[...prev,{user:d.user,nickname:d.nickname||d.user,diamonds:dm,gifts:1}];return upd.sort((a,b)=>b.diamonds-a.diamonds).slice(0,5);});
        fireAction("Gift Alert",d.giftName,d.nickname,d.giftCount);
      } else if(d.type==="follow"){
        setLog(p=>[{t:"follow",tx:`➕ @${d.nickname||d.user} te siguió`},...p].slice(0,30));
        setStats(p=>({...p,follows:p.follows+1}));
        fireAction("Follow Alert","",d.nickname||d.user);
      } else if(d.type==="like"){
        const lc=d.likeCount||1;
        setLog(p=>[{t:"like",tx:`❤️ @${d.user} × ${lc} likes`},...p].slice(0,30));
        setStats(p=>({...p,likes:p.likes+lc}));setTotLike(p=>p+lc);
        setLAnim(true);setTimeout(()=>setLAnim(false),300);
        const hid=Date.now();setFh(p=>[...p,{id:hid,x:Math.random()*60+20}]);setTimeout(()=>setFh(p=>p.filter(h=>h.id!==hid)),1000);
        setLikeR(prev=>{const ex=prev.find(u=>u.user===d.user);const upd=ex?prev.map(u=>u.user===d.user?{...u,count:u.count+lc}:u):[...prev,{user:d.user,nickname:d.user,count:lc}];return upd.sort((a,b)=>b.count-a.count).slice(0,5);});
        fireAction("Like Alert","",d.user);
      } else if(d.type==="sub"){
        setLog(p=>[{t:"sub",tx:`⭐ @${d.nickname||d.user} se suscribió`},...p].slice(0,30));
        fireAction("Sub Alert","",d.nickname||d.user);
      } else if(d.type==="share"){
        setLog(p=>[{t:"share",tx:`📤 @${d.nickname||d.user} compartió el LIVE`},...p].slice(0,30));
        fireAction("Share Alert","",d.nickname||d.user);
      }
    });
    sock.on("viewers",d=>setStats(p=>({...p,viewers:d.count})));
    sock.on("disconnected",()=>setConn(false));
    sock.on("error",d=>setLog(p=>[{t:"sys",tx:`⚠️ ${d.message}`},...p]));
    return()=>sock.disconnect();
  },[fireAction]);

  useEffect(()=>{if(!conn2) return;const t=setInterval(()=>setDots(d=>d.length>=3?"":d+"."),400);return()=>clearInterval(t);},[conn2]);

  const applyVoice=()=>{actVR.current=ttsV;setActV(ttsV);sv("ttsVoice",ttsV);setVOk(true);setTimeout(()=>setVOk(false),2500);};

  const connect=async()=>{
    if(!tUser.trim()) return;
    setConn2(true);
    try{
      const r=await fetch(`${SERVER}/connect`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:tUser})});
      const d=await r.json();
      if(d.success){setConn2(false);setConn(true);setStats({viewers:0,gifts:0,follows:0,messages:0,likes:0});setTotDia(0);setTotLike(0);setTapR([]);setLikeR([]);setLog([{t:"sys",tx:`✅ Conectado a @${tUser}`}]);}
      else{setConn2(false);setLog([{t:"sys",tx:`⚠️ ${d.error||"¿Estás en LIVE?"}`}]);}
    }catch(e){setConn2(false);setLog([{t:"sys",tx:"⚠️ Error al conectar"}]);}
  };

  const disconnect=async()=>{await fetch(`${SERVER}/disconnect`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:tUser})}).catch(()=>{});setConn(false);setLog([]);setStats({viewers:0,gifts:0,follows:0,messages:0,likes:0});setTotDia(0);setTotLike(0);};

  const logout=()=>{clr();setUser(null);};

  if(!user) return <Login onLogin={u=>{sv("session",u);setUser(u);}}/>;

  const TABS=[{id:"dashboard",icon:"⚡",l:"Dashboard"},{id:"acciones",icon:"🎬",l:"Acciones"},{id:"tts",icon:"🔊",l:"TTS"},{id:"ranking",icon:"🏆",l:"Ranking"},{id:"chat",icon:"💬",l:"Chat"}];
  const LC={gift:"rgba(254,44,85,.1)",follow:"rgba(37,244,238,.1)",msg:"rgba(255,255,255,.03)",like:"rgba(254,44,85,.06)",sub:"rgba(139,92,246,.1)",share:"rgba(255,255,255,.05)",sys:"rgba(37,244,238,.07)"};
  const LB={gift:"#fe2c55",follow:"#25f4ee",msg:"#252535",like:"#fe2c55",sub:"#8b5cf6",share:"#888",sys:"#25f4ee"};
  const bCls=ev=>ev.startsWith("Follow")?"bf":ev.startsWith("Gift")?"bg":ev.startsWith("Like")?"bl":ev.startsWith("Sub")?"bs":"bsh";
  const bIco=ev=>ev.startsWith("Follow")?"➕":ev.startsWith("Gift")?"🎁":ev.startsWith("Like")?"❤️":ev.startsWith("Sub")?"⭐":"📤";

  const saveAction=form=>{
    if(form.id&&actions.find(a=>a.id===form.id)){setActions(p=>p.map(a=>a.id===form.id?form:a));showT("✅ Acción actualizada");}
    else{setActions(p=>[...p,{...form,id:Date.now()}]);showT("✅ Acción creada");}
    setShowM(false);setEditA(null);
  };

  const testAction=async act=>{
    if(act.soundUrl){try{const a=new Audio(act.soundUrl);a.volume=ttsVolR.current/100;a.play();}catch(e){}}
    if(act.ttsOn&&act.ttsText){enqueueTTS(act.ttsText.replace(/@usuario/gi,"UsuarioPrueba"),actVR.current,ttsVolR.current/100);}
    showT(`▶ Probando: ${act.name}`);
  };

  const C={background:"#12121e",border:"1px solid #1e1e2e",borderRadius:15,padding:16,marginBottom:13};
  const lbl={display:"block",color:"#555",fontSize:10,fontWeight:700,letterSpacing:.8,textTransform:"uppercase",marginBottom:6};
  const inp={width:"100%",background:"#0a0a0f",border:"1px solid #252535",borderRadius:9,padding:"10px 13px",color:"#fff",fontSize:13,outline:"none"};

  const fActs=actions.filter(a=>a.name.toLowerCase().includes(searchQ.toLowerCase()));

  return <div style={{display:"flex",minHeight:"100vh",background:"#0a0a0f"}}>
    {showM&&<ActModal action={editA} voiceId={actVR.current} vol={ttsVol} onSave={saveAction} onClose={()=>{setShowM(false);setEditA(null);}}/>}
    {toast&&<div className="toast">{toast}</div>}
    {sb&&<div onClick={()=>setSb(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:40}}/>}

    {/* Sidebar */}
    <div style={{width:220,background:"#0d0d18",borderRight:"1px solid #1a1a28",display:"flex",flexDirection:"column",padding:"15px 11px",position:"fixed",top:0,bottom:0,left:0,zIndex:50,transform:sb?"translateX(0)":"translateX(-100%)",transition:"transform .3s ease"}}>
      <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:15,paddingLeft:3}}>
        <div style={{width:28,height:28,borderRadius:7,background:"linear-gradient(135deg,#fe2c55,#25f4ee)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:14}}>T</div>
        <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:17,letterSpacing:-.5}}>ik<span style={{color:"#fe2c55"}}>Panel</span></span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8,background:"#1a1a28",borderRadius:9,padding:"8px 10px",marginBottom:9}}>
        <div style={{width:28,height:28,borderRadius:"50%",flexShrink:0,background:"linear-gradient(135deg,#fe2c55,#25f4ee)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:12}}>{user.avatar}</div>
        <div style={{overflow:"hidden"}}><div style={{fontSize:12,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{user.name}</div><div style={{fontSize:10,color:"#fe2c55",fontWeight:600,marginTop:1}}>{user.plan}</div></div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:6,background:conn?"rgba(37,244,238,.05)":"rgba(255,255,255,.02)",border:`1px solid ${conn?"rgba(37,244,238,.2)":"#1a1a28"}`,borderRadius:20,padding:"4px 10px",fontSize:10,color:conn?"#25f4ee":"#444",marginBottom:13,overflow:"hidden"}}>
        <div className={conn?"ld":""} style={{width:5,height:5,borderRadius:"50%",flexShrink:0,background:conn?"#25f4ee":"#252535",boxShadow:conn?"0 0 7px #25f4ee":"none"}}/>
        <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{conn?`@${tUser}`:"Sin conexión"}</span>
      </div>
      <nav style={{display:"flex",flexDirection:"column",gap:2,flex:1}}>
        {TABS.map(t=><button key={t.id} onClick={()=>{setTab(t.id);setSb(false);}} style={{display:"flex",alignItems:"center",gap:8,background:tab===t.id?"rgba(254,44,85,.1)":"transparent",border:tab===t.id?"1px solid rgba(254,44,85,.18)":"1px solid transparent",borderRadius:8,padding:"9px 9px",color:tab===t.id?"#fff":"#555",cursor:"pointer",fontSize:12,fontWeight:tab===t.id?700:500,textAlign:"left"}}><span style={{fontSize:14}}>{t.icon}</span>{t.l}</button>)}
      </nav>
      <button onClick={logout} style={{background:"transparent",border:"1px solid #1a1a28",borderRadius:8,padding:"7px 9px",color:"#444",cursor:"pointer",fontSize:11,marginTop:5}}>Cerrar sesión</button>
    </div>

    {/* Main */}
    <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 13px",borderBottom:"1px solid #1a1a28",background:"#0a0a0f",position:"sticky",top:0,zIndex:30}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <button onClick={()=>setSb(!sb)} style={{background:"#1a1a28",border:"1px solid #252535",borderRadius:7,width:31,height:31,cursor:"pointer",color:"#fff",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>☰</button>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:14}}>{TABS.find(t=>t.id===tab)?.icon} {TABS.find(t=>t.id===tab)?.l}</div>
        </div>
        {conn&&<div style={{display:"flex",alignItems:"center",gap:5,background:"rgba(254,44,85,.1)",border:"1px solid rgba(254,44,85,.25)",borderRadius:20,padding:"3px 10px",color:"#fe2c55",fontWeight:800,fontSize:9,letterSpacing:1}}>
          <div className="ld" style={{width:5,height:5,borderRadius:"50%",background:"#fe2c55",boxShadow:"0 0 7px #fe2c55"}}/>EN VIVO</div>}
      </div>

      <div style={{padding:13,flex:1,overflowY:"auto"}}>

        {/* ── DASHBOARD ── */}
        {tab==="dashboard"&&<div className="ai">
          <div style={C}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,marginBottom:11}}>🎯 Conectar al LIVE</div>
            <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
              <div style={{display:"flex",alignItems:"center",flex:1,minWidth:120,background:"#0a0a0f",border:"1px solid #252535",borderRadius:9,overflow:"hidden"}}>
                <span style={{color:"#fe2c55",fontWeight:800,padding:"0 9px",fontSize:14,flexShrink:0}}>@</span>
                <input value={tUser} onChange={e=>setTUser(e.target.value)} placeholder="usuario_tiktok" disabled={conn||conn2} style={{flex:1,background:"transparent",border:"none",padding:"10px 5px 10px 0",color:"#fff",fontSize:12,outline:"none",minWidth:0}}/>
              </div>
              {!conn
                ?<button onClick={connect} disabled={conn2||!tUser} style={{background:(!conn2&&tUser)?"linear-gradient(135deg,#fe2c55,#ff6b81)":"#1e1e2e",border:"none",borderRadius:9,padding:"10px 15px",color:(!conn2&&tUser)?"#fff":"#444",fontWeight:700,cursor:(!conn2&&tUser)?"pointer":"not-allowed",fontSize:12,whiteSpace:"nowrap"}}>{conn2?`Conectando${dots}`:"Conectar"}</button>
                :<button onClick={disconnect} style={{background:"rgba(254,44,85,.1)",border:"1px solid rgba(254,44,85,.3)",borderRadius:9,padding:"10px 15px",color:"#fe2c55",fontWeight:700,cursor:"pointer",fontSize:12,whiteSpace:"nowrap"}}>Desconectar</button>}
            </div>
            {conn2&&<div style={{height:3,background:"#1e1e2e",borderRadius:2,marginTop:9,overflow:"hidden"}}><div className="cf" style={{height:"100%",width:"50%",background:"linear-gradient(90deg,#25f4ee,#fe2c55)",borderRadius:2}}/></div>}
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:9,marginBottom:13}}>
            {[{l:"Espectadores",v:stats.viewers,ic:"👁️",c:"#25f4ee"},{l:"Regalos",v:stats.gifts,ic:"🎁",c:"#fe2c55"},{l:"Seguidores",v:stats.follows,ic:"➕",c:"#ffd700"},{l:"Mensajes",v:stats.messages,ic:"💬",c:"#a78bfa"}].map(s=><div key={s.l} style={{background:"#12121e",border:"1px solid #1e1e2e",borderRadius:12,padding:13,textAlign:"center"}}>
              <div style={{fontSize:18,marginBottom:4}}>{s.ic}</div>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:20,color:s.c}}>{s.v.toLocaleString()}</div>
              <div style={{color:"#444",fontSize:9,marginTop:3,fontWeight:600}}>{s.l}</div>
            </div>)}
          </div>

          <div style={{...C,display:"flex",alignItems:"center",justifyContent:"space-between",position:"relative",overflow:"hidden"}}>
            <div style={{display:"flex",alignItems:"center",gap:11}}>
              <div className={lAnim?"hpa":""} style={{fontSize:28}}>❤️</div>
              <div><div style={{fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:26,color:"#fe2c55",lineHeight:1}}>{stats.likes.toLocaleString()}</div><div style={{color:"#555",fontSize:9,fontWeight:600,marginTop:2}}>LIKES EN EL LIVE</div></div>
            </div>
            <div style={{textAlign:"right"}}><div style={{color:"#333",fontSize:9}}>💎 Diamantes</div><div style={{color:"#ffd700",fontWeight:800,fontSize:15}}>{totDia.toLocaleString()}</div></div>
            {fh.map(h=><span key={h.id} className="fh" style={{left:`${h.x}%`,bottom:5}}>❤️</span>)}
          </div>

          <div style={C}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,marginBottom:9}}>📋 Actividad en tiempo real</div>
            <div style={{background:"#0a0a0f",borderRadius:9,padding:9,height:200,overflowY:"auto",display:"flex",flexDirection:"column",gap:3}}>
              {log.length===0?<div style={{color:"#333",fontSize:11,textAlign:"center",marginTop:75}}>{conn?"Esperando actividad...":"Conecta tu LIVE"}</div>
                :log.map((item,i)=><div key={i} style={{fontSize:10,padding:"5px 8px",borderRadius:5,background:LC[item.t]||"rgba(255,255,255,.03)",borderLeft:`2px solid ${LB[item.t]||"#252535"}`,color:LB[item.t]||"#888"}}>{item.tx}</div>)}
            </div>
          </div>
        </div>}

        {/* ── ACCIONES ── */}
        {tab==="acciones"&&<div className="ai">
          <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:13,flexWrap:"wrap"}}>
            <button onClick={()=>{setEditA(null);setShowM(true);}} style={{background:"linear-gradient(135deg,#fe2c55,#ff6b81)",border:"none",borderRadius:8,padding:"8px 14px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:12}}>+ Nueva Acción</button>
            <div style={{display:"flex",alignItems:"center",gap:6,background:"#12121e",border:"1px solid #1e1e2e",borderRadius:20,padding:"5px 12px",cursor:"pointer"}} onClick={()=>setAlertsOn(!alertsOn)}>
              <div className={alertsOn?"ld":""} style={{width:7,height:7,borderRadius:"50%",background:alertsOn?"#25f4ee":"#444",boxShadow:alertsOn?"0 0 7px #25f4ee":"none"}}/>
              <span style={{fontSize:11,fontWeight:700,color:alertsOn?"#25f4ee":"#555"}}>{alertsOn?"Habilitado":"Deshabilitado"}</span>
            </div>
            <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="🔍 Buscar acción..." style={{flex:1,minWidth:100,background:"#12121e",border:"1px solid #1e1e2e",borderRadius:8,padding:"7px 11px",color:"#fff",fontSize:11,outline:"none"}}/>
          </div>

          <div style={{background:"#12121e",border:"1px solid #1e1e2e",borderRadius:14,overflow:"hidden"}}>
            {/* Header tabla */}
            <div className="tr" style={{background:"#0d0d18",borderBottom:"1px solid #1e1e2e"}}>
              {["","Nombre","Evento","Dur.","🎵","TTS",""].map((h,i)=><div key={i} className="th">{h}</div>)}
            </div>

            {fActs.length===0&&<div style={{textAlign:"center",padding:"36px 16px",color:"#333",fontSize:12}}>{searchQ?"Sin resultados":"Crea tu primera acción ↑"}</div>}

            {fActs.map((act)=><div key={act.id} className={`tr ${act.enabled?"":"dis"}`}>
              <button className={`it ${act.enabled?"on":""}`} onClick={()=>setActions(p=>p.map(a=>a.id===act.id?{...a,enabled:!a.enabled}:a))}/>
              <div>
                <div style={{color:act.enabled?"#fff":"#666",fontSize:12,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{act.name}</div>
                <div style={{fontSize:9,color:"#444",marginTop:1,fontFamily:"'JetBrains Mono',monospace"}}>{act.event==="Gift Alert"?`🎁 ${act.giftName} ×${act.minCount}`:act.event}</div>
              </div>
              <div><span className={`badge ${bCls(act.event)}`}>{bIco(act.event)} {act.event.replace(" Alert","")}</span></div>
              <div style={{fontSize:10,color:"#555",fontFamily:"'JetBrains Mono',monospace"}}>{act.duration}s</div>
              <div style={{textAlign:"center",fontSize:13}}>{act.soundName?<span style={{color:"#25f4ee"}}>🎵</span>:<span style={{color:"#252535"}}>—</span>}</div>
              <div style={{textAlign:"center",fontSize:12}}>{act.ttsOn&&act.ttsText?<span style={{color:"#25f4ee"}}>🔊</span>:<span style={{color:"#252535"}}>—</span>}</div>
              <div style={{display:"flex",gap:3,justifyContent:"flex-end"}}>
                {[{ico:"▶",fn:()=>testAction(act),c:"#25f4ee"},{ico:"✏️",fn:()=>{setEditA(act);setShowM(true);},c:"#aaa"},{ico:"🗑️",fn:()=>{if(confirm(`¿Eliminar "${act.name}"?`)){setActions(p=>p.filter(a=>a.id!==act.id));showT("🗑️ Eliminada");}},c:"#fe2c55"}].map((b,i)=><button key={i} onClick={b.fn} style={{background:"transparent",border:"1px solid #1e1e2e",borderRadius:5,width:23,height:23,cursor:"pointer",color:b.c,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10}}>{b.ico}</button>)}
              </div>
            </div>)}
          </div>
          <div style={{background:"rgba(37,244,238,.03)",border:"1px solid rgba(37,244,238,.1)",borderRadius:9,padding:"10px 13px",color:"#444",fontSize:10,lineHeight:1.7,marginTop:11}}>
            ⚠️ Los MP3 se pierden al recargar la página — súbelos de nuevo después de actualizar. El TTS usa ElevenLabs con la voz activa en la pestaña TTS.
          </div>
        </div>}

        {/* ── TTS ── */}
        {tab==="tts"&&<div className="ai">
          <div style={C}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,marginBottom:15}}>🔊 Texto a Voz — ElevenLabs</div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
              <div><div style={{fontSize:13,fontWeight:600}}>TTS global de comentarios</div><div style={{fontSize:10,color:"#555",marginTop:2}}>Lee los comentarios del chat en vivo</div></div>
              <Toggle on={ttsOn} onChange={()=>setTtsOn(!ttsOn)}/>
            </div>

            <div style={{marginBottom:9}}>
              <label style={lbl}>Seleccionar voz {ldV&&<span style={{color:"#25f4ee"}}>⏳</span>}</label>
              <select value={ttsV} onChange={e=>setTtsV(e.target.value)} disabled={!ttsOn} style={{...inp,cursor:"pointer",marginBottom:9}}>
                {voices.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
              </select>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(37,244,238,.05)",border:"1px solid rgba(37,244,238,.15)",borderRadius:9,padding:"9px 13px",marginBottom:9}}>
                <div><div style={{color:"#444",fontSize:9,fontWeight:600,letterSpacing:.5}}>VOZ ACTIVA EN EL LIVE</div><div style={{color:"#25f4ee",fontSize:12,fontWeight:700,marginTop:2}}>{voices.find(v=>v.id===actV)?.name||"Bella"}</div></div>
                <div className="ld" style={{width:7,height:7,borderRadius:"50%",background:"#25f4ee",boxShadow:"0 0 7px #25f4ee"}}/>
              </div>
              <button onClick={applyVoice} disabled={!ttsOn} style={{width:"100%",background:!ttsOn?"#1a1a28":ttsV===actV?"rgba(37,244,238,.1)":"linear-gradient(135deg,#fe2c55,#ff6b81)",border:ttsV===actV?"1px solid rgba(37,244,238,.3)":"none",borderRadius:9,padding:"11px",color:!ttsOn?"#444":ttsV===actV?"#25f4ee":"#fff",fontWeight:700,cursor:!ttsOn?"not-allowed":"pointer",fontSize:13,marginBottom:15}}>
                {vOk?"✅ ¡Voz aplicada!":ttsV===actV?"✓ Esta voz ya está activa":"🎙️ Aplicar voz al LIVE"}
              </button>
            </div>

            <div style={{marginBottom:14}}>
              <label style={lbl}>Volumen global: {ttsVol}%</label>
              <input type="range" min="0" max="100" value={ttsVol} onChange={e=>setTtsVol(Number(e.target.value))} style={{width:"100%",accentColor:"#fe2c55"}}/>
            </div>

            <div style={{background:"rgba(37,244,238,.04)",border:"1px solid rgba(37,244,238,.1)",borderRadius:9,padding:"10px 13px",color:"#555",fontSize:11,lineHeight:1.7}}>
              💡 El TTS de comentarios se activa aquí. Los mensajes por regalo/seguidor/like se configuran individualmente en <strong style={{color:"#fe2c55"}}>Acciones</strong>.
            </div>
          </div>
          <div style={C}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,marginBottom:11}}>🎤 Probar voz activa</div>
            <input id="ttsT" placeholder="Escribe algo para probar la voz..." style={{...inp,marginBottom:9}}/>
            <button disabled={!ttsOn} onClick={()=>{const t=document.getElementById("ttsT").value||"Hola, esto es TikPanel con ElevenLabs";enqueueTTS(t,actVR.current,ttsVol/100);}}
              style={{width:"100%",background:ttsOn?"rgba(254,44,85,.1)":"transparent",border:"1px solid rgba(254,44,85,.2)",borderRadius:9,padding:"10px",color:ttsOn?"#fe2c55":"#333",fontWeight:700,cursor:ttsOn?"pointer":"not-allowed",fontSize:12}}>
              ▶ Reproducir con voz activa
            </button>
          </div>
        </div>}

        {/* ── RANKING ── */}
        {tab==="ranking"&&<div className="ai">
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:13}}>
            {[{ic:"💎",v:totDia,l:"DIAMANTES TOTALES",c:"#ffd700"},{ic:"❤️",v:totLike,l:"LIKES TOTALES",c:"#fe2c55"}].map(s=><div key={s.l} style={{background:"#12121e",border:"1px solid #1e1e2e",borderRadius:12,padding:13,textAlign:"center"}}>
              <div style={{fontSize:18,marginBottom:4}}>{s.ic}</div>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:900,fontSize:20,color:s.c}}>{s.v.toLocaleString()}</div>
              <div style={{color:"#444",fontSize:9,fontWeight:600,marginTop:3}}>{s.l}</div>
            </div>)}
          </div>
          {[{title:"🎁 Top Tap Tap",data:tapR,key:"diamonds",color:"#ffd700",icon:"💎",empty:"Esperando regalos..."},
            {title:"❤️ Top Likes",  data:likeR,key:"count",   color:"#fe2c55",icon:"❤️",empty:"Esperando likes..."}
          ].map(({title,data,key,color,icon,empty})=><div key={title} style={C}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,marginBottom:12}}>{title}</div>
            {data.length===0?<div style={{textAlign:"center",padding:"18px 0",color:"#333",fontSize:11}}>{conn?empty:"Conecta tu LIVE"}</div>
              :data.map((item,i)=>{
                const medals=["🥇","🥈","🥉","4️⃣","5️⃣"];const max=data[0][key]||1;const pct=Math.round((item[key]/max)*100);
                return <div key={item.user} style={{marginBottom:9}}>
                  <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
                    <span style={{fontSize:14,flexShrink:0}}>{medals[i]}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <span style={{color:"#fff",fontSize:11,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>@{item.nickname}</span>
                        <span style={{color,fontWeight:800,fontSize:11,flexShrink:0,marginLeft:7}}>{icon} {item[key].toLocaleString()}</span>
                      </div>
                      <div style={{height:3,background:"#1a1a28",borderRadius:2,marginTop:3,overflow:"hidden"}}>
                        <div style={{height:"100%",width:`${pct}%`,borderRadius:2,transition:"width .5s",background:key==="count"?"linear-gradient(90deg,#fe2c55,#ff6b81)":i===0?"linear-gradient(90deg,#ffd700,#ffaa00)":i===1?"linear-gradient(90deg,#ccc,#888)":"#2a2a3a"}}/>
                      </div>
                    </div>
                  </div>
                </div>;
              })}
          </div>)}
        </div>}

        {/* ── CHAT BOT ── */}
        {tab==="chat"&&<div className="ai">
          <div style={C}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,marginBottom:11}}>💬 Chat Bot Automático</div>
            <div style={{background:"rgba(37,244,238,.04)",border:"1px solid rgba(37,244,238,.1)",borderRadius:9,padding:"10px 13px",color:"#555",fontSize:11,lineHeight:1.7,marginBottom:13}}>
              💡 El bot responde cuando alguien escribe un comando en tu LIVE.
            </div>
            {[{t:"!hola",r:"¡Hola! Bienvenido al LIVE de Luz Álva 🎉"},{t:"!precio",r:"Revisa el link en mi bio 👆"},{t:"!redes",r:"Sígueme en todas mis redes 📱"}].map((cmd,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:9,background:"#0a0a0f",borderRadius:8,padding:"10px 12px",marginBottom:7}}>
              <span style={{color:"#25f4ee",fontWeight:700,fontSize:11,minWidth:55,fontFamily:"'JetBrains Mono',monospace"}}>{cmd.t}</span>
              <span style={{color:"#333"}}>→</span>
              <span style={{color:"#555",fontSize:11,flex:1}}>{cmd.r}</span>
            </div>)}
            <button style={{background:"rgba(254,44,85,.07)",border:"1px dashed rgba(254,44,85,.3)",borderRadius:8,padding:"9px",color:"#fe2c55",fontWeight:700,cursor:"pointer",fontSize:12,width:"100%",marginTop:2}}>+ Añadir comando</button>
          </div>
        </div>}

      </div>
    </div>
  </div>;
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
