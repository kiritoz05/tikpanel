<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikPanel ULTRA</title><script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script><style>
body{
  margin:0;
  background:#0a0a0f;
  color:#fff;
  font-family:sans-serif;
}

/* CONTENEDOR */
.container{
  padding:10px;
  max-width:600px;
  margin:auto;
}

/* CARDS */
.card{
  background:#13131a;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

/* INPUTS */
input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}

/* BOTONES GRANDES */
button{
  width:100%;
  padding:12px;
  margin-top:5px;
  border:none;
  border-radius:10px;
  background:#ff0050;
  color:#fff;
  font-size:16px;
}

/* REGALOS GRID */
.gifts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.gift{
  text-align:center;
  font-size:12px;
}

.gift img{
  width:100%;
}

/* RANKING */
.rank{
  font-size:14px;
}
</style></head><body>
<div id="root"></div>
<script type="text/babel" src="app.js"></script>
</body>
</html>
