<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Top Likes Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{ margin:0; padding:0; box-sizing:border-box; }

body {
  background: transparent;
  width: 420px;
  min-height: 100vh;
  font-family: 'Nunito', sans-serif;
  overflow: hidden;
  padding: 12px 10px;
}

/* ── Partículas sparkle ── */
.sparkle-field { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.sp {
  position:absolute;
  border-radius:50%;
  animation: spFloat linear infinite;
}
@keyframes spFloat {
  0%   { transform: translateY(110vh) scale(0); opacity:0; }
  10%  { opacity:1; }
  90%  { opacity:0.8; }
  100% { transform: translateY(-10vh) scale(1); opacity:0; }
}

/* ── Panel ── */
.panel {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ── Header TOP LIKES ── */
.header {
  text-align: center;
  margin-bottom: 4px;
  position: relative;
}
.header-glow {
  position:absolute; inset:-10px;
  background: radial-gradient(ellipse at 50% 50%, rgba(180,80,255,0.25), transparent 70%);
  pointer-events:none;
}
.header h1 {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: 28px;
  letter-spacing: 4px;
  background: linear-gradient(180deg, #fff 0%, #d580ff 50%, #9b30ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  filter: drop-shadow(0 0 20px rgba(180,80,255,0.8));
  position: relative;
}
.header-crown {
  font-size: 36px;
  display: block;
  filter: drop-shadow(0 0 15px #ffd700) drop-shadow(0 0 30px #ffa500);
  animation: crownFloat 3s ease-in-out infinite;
  margin-bottom: -4px;
}
@keyframes crownFloat {
  0%,100% { transform: translateY(0) rotate(-5deg); }
  50%     { transform: translateY(-6px) rotate(5deg); }
}

/* ── Stars decorativas ── */
.deco-star {
  position:absolute;
  font-size:24px;
  animation: starPulse 2s ease-in-out infinite;
  filter: drop-shadow(0 0 8px #ffd700);
}
@keyframes starPulse {
  0%,100%{ transform:scale(1) rotate(0deg); opacity:1; }
  50%    { transform:scale(1.3) rotate(20deg); opacity:0.7; }
}

/* ── Item ranking ── */
.item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  animation: itemIn 0.5s cubic-bezier(.22,1,.36,1) both;
  cursor: default;
  transition: transform 0.2s ease;
}
.item:hover { transform: translateX(4px); }

@keyframes itemIn {
  from { opacity:0; transform:translateX(-30px) scale(0.95); }
  to   { opacity:1; transform:translateX(0) scale(1); }
}

/* #1 gold */
.rank-1 {
  background: linear-gradient(135deg, rgba(20,10,0,0.85), rgba(40,25,0,0.85));
  border: 2px solid #ffd700;
  box-shadow:
    0 0 20px rgba(255,215,0,0.4),
    0 0 40px rgba(255,215,0,0.15),
    inset 0 0 20px rgba(255,215,0,0.05);
}
/* #2 silver */
.rank-2 {
  background: linear-gradient(135deg, rgba(10,10,20,0.85), rgba(20,20,35,0.85));
  border: 2px solid #a0b4d0;
  box-shadow: 0 0 15px rgba(160,180,208,0.3), inset 0 0 15px rgba(160,180,208,0.04);
}
/* #3 bronze */
.rank-3 {
  background: linear-gradient(135deg, rgba(20,10,0,0.85), rgba(35,18,5,0.85));
  border: 2px solid #cd7f32;
  box-shadow: 0 0 15px rgba(205,127,50,0.3), inset 0 0 15px rgba(205,127,50,0.04);
}
/* #4+ */
.rank-other {
  background: rgba(10,8,20,0.75);
  border: 1.5px solid rgba(255,255,255,0.1);
  box-shadow: 0 0 10px rgba(100,80,200,0.15);
}

/* shimmer bar */
.item::after {
  content:'';
  position:absolute;
  top:0; left:-100%; width:60%; height:100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
  animation: shimmer 4s ease-in-out infinite;
}
@keyframes shimmer {
  0%  { left:-100%; }
  50%,100% { left:150%; }
}

/* ── Rank number ── */
.rank-num {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: 22px;
  min-width: 32px;
  text-align: center;
  position: relative;
  z-index:2;
  flex-shrink:0;
}
.rank-1 .rank-num { color:#ffd700; text-shadow:0 0 15px #ffd700, 0 0 30px #ffa500; }
.rank-2 .rank-num { color:#c8d8e8; text-shadow:0 0 10px #a0b4d0; }
.rank-3 .rank-num { color:#e8a060; text-shadow:0 0 10px #cd7f32; }
.rank-other .rank-num { color:#6655aa; text-shadow:0 0 8px rgba(120,100,200,0.5); }

/* ── Corona sobre número ── */
.mini-crown {
  position:absolute;
  top:-10px; left:50%; transform:translateX(-50%);
  font-size:16px;
  filter: drop-shadow(0 0 6px #ffd700);
  animation: crownFloat 2.5s ease-in-out infinite;
}

/* ── Avatar ── */
.avatar-wrap {
  position:relative;
  flex-shrink:0;
  z-index:2;
}
.avatar {
  width: 52px; height: 52px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  background: rgba(80,60,120,0.5);
  font-size: 22px;
  line-height: 52px;
  text-align: center;
}
.avatar-ring {
  position:absolute;
  inset:-3px;
  border-radius:50%;
  animation: ringRotate 4s linear infinite;
}
.rank-1 .avatar-ring { border:2.5px solid transparent; border-top-color:#ffd700; border-right-color:#ffa500; box-shadow:0 0 12px #ffd70066; }
.rank-2 .avatar-ring { border:2px solid transparent; border-top-color:#c0c0c0; border-right-color:#a0b4d0; }
.rank-3 .avatar-ring { border:2px solid transparent; border-top-color:#cd7f32; border-right-color:#e8a060; }
.rank-other .avatar-ring { border:1.5px solid rgba(120,100,200,0.3); animation:none; }
@keyframes ringRotate { to { transform:rotate(360deg); } }

/* ── Info ── */
.info {
  flex:1;
  min-width:0;
  position:relative;
  z-index:2;
}
.username {
  font-weight:900;
  font-size:14px;
  color:#fff;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  letter-spacing:0.3px;
}
.rank-1 .username { color:#fff; text-shadow:0 0 8px rgba(255,215,0,0.4); font-size:15px; }

.likes-row {
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:3px;
}
.likes-num {
  font-family:'Orbitron', monospace;
  font-weight:700;
  font-size:17px;
  transition: all 0.4s ease;
}
.rank-1 .likes-num { font-size:20px; color:#25f4ee; text-shadow:0 0 15px #25f4ee, 0 0 30px #25f4ee66; }
.rank-2 .likes-num { color:#a0c8ff; text-shadow:0 0 10px rgba(100,180,255,0.5); }
.rank-3 .likes-num { color:#ffaa55; text-shadow:0 0 10px rgba(255,150,50,0.5); }
.rank-other .likes-num { color:#aa88ff; text-shadow:0 0 8px rgba(150,100,255,0.4); }

.likes-label {
  font-size:11px;
  font-weight:800;
  letter-spacing:1.5px;
  opacity:0.65;
}
.rank-1 .likes-label { color:#25f4ee; }
.rank-2 .likes-label { color:#a0c8ff; }
.rank-3 .likes-label { color:#ffaa55; }
.rank-other .likes-label { color:#aa88ff; }

/* ── Heart icon ── */
.heart {
  font-size:20px;
  flex-shrink:0;
  z-index:2;
  animation: heartbeat 1.8s ease-in-out infinite;
  filter: drop-shadow(0 0 8px rgba(254,44,85,0.8));
}
.rank-1 .heart { font-size:24px; filter:drop-shadow(0 0 12px rgba(254,44,85,1)); }
@keyframes heartbeat {
  0%,100%{ transform:scale(1); }
  20%    { transform:scale(1.3); }
  40%    { transform:scale(1); }
  60%    { transform:scale(1.15); }
}

/* ── Pop animación para números ── */
.pop-anim {
  animation: numPop 0.4s cubic-bezier(.22,1,.36,1);
}
@keyframes numPop {
  0%  { transform:scale(1.5); color:#fff; }
  100%{ transform:scale(1); }
}

/* ── Línea neon decorativa ── */
.neon-bar {
  height:2px;
  border-radius:2px;
  background: linear-gradient(90deg, transparent 0%, #fe2c55 20%, #d580ff 50%, #25f4ee 80%, transparent 100%);
  opacity:0.7;
  animation: neonFlow 3s ease-in-out infinite;
  margin:2px 0;
}
@keyframes neonFlow {
  0%,100%{ opacity:0.5; }
  50%    { opacity:1; box-shadow:0 0 8px #d580ff; }
}

/* ── Footer nombre streamer ── */
.footer-pill {
  margin-top:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background: linear-gradient(135deg, rgba(90,30,160,0.8), rgba(30,20,80,0.8));
  border:1.5px solid rgba(180,80,255,0.5);
  border-radius:100px;
  padding:10px 24px;
  box-shadow: 0 0 20px rgba(180,80,255,0.3), 0 0 40px rgba(180,80,255,0.1);
}
.footer-stars { font-size:20px; filter:drop-shadow(0 0 8px #d580ff); animation:starPulse 2s ease-in-out infinite; }
.footer-name {
  font-family:'Orbitron', monospace;
  font-weight:900;
  font-size:14px;
  letter-spacing:2px;
  background: linear-gradient(90deg, #fff, #d580ff, #25f4ee);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

/* ── Neon swirls decorativos ── */
.swirlL, .swirlR {
  position:fixed;
  top:0; bottom:0; width:40px;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.swirlL { left:0; }
.swirlR { right:0; }
.swirlL svg, .swirlR svg { width:100%; height:100%; }
</style>
</head>
<body>

<!-- Swirls neon laterales -->
<div class="swirlL">
  <svg viewBox="0 0 40 800" preserveAspectRatio="none">
    <path d="M20 0 Q5 100 20 200 Q35 300 20 400 Q5 500 20 600 Q35 700 20 800"
          fill="none" stroke="url(#lg1)" stroke-width="2.5" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="0" to="800" dur="3s" repeatCount="indefinite"/>
    </path>
    <defs>
      <linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fe2c55"/>
        <stop offset="50%" stop-color="#d580ff"/>
        <stop offset="100%" stop-color="#25f4ee"/>
      </linearGradient>
    </defs>
  </svg>
</div>
<div class="swirlR">
  <svg viewBox="0 0 40 800" preserveAspectRatio="none">
    <path d="M20 0 Q35 100 20 200 Q5 300 20 400 Q35 500 20 600 Q5 700 20 800"
          fill="none" stroke="url(#lg2)" stroke-width="2.5" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="800" to="0" dur="3s" repeatCount="indefinite"/>
    </path>
    <defs>
      <linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#25f4ee"/>
        <stop offset="50%" stop-color="#d580ff"/>
        <stop offset="100%" stop-color="#fe2c55"/>
      </linearGradient>
    </defs>
  </svg>
</div>

<!-- Partículas -->
<div class="sparkle-field" id="sparks"></div>

<!-- Panel principal -->
<div class="panel">
  <!-- Header -->
  <div class="header" style="position:relative">
    <div class="header-glow"></div>
    <span class="header-crown">👑</span>
    <h1>TOP LIKES</h1>
    <!-- estrellas deco -->
    <span class="deco-star" style="top:0;left:10px;animation-delay:0s">⭐</span>
    <span class="deco-star" style="top:10px;right:8px;animation-delay:0.7s;font-size:18px">✨</span>
  </div>

  <div class="neon-bar"></div>

  <!-- Lista ranking -->
  <div id="list"></div>

  <!-- Footer streamer -->
  <div class="footer-pill" id="footerPill">
    <span class="footer-stars">⭐</span>
    <span class="footer-name" id="footerName">TOP LIVE</span>
    <span class="footer-stars" style="animation-delay:1s">⭐</span>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// CONFIG — cambia estos valores
// ══════════════════════════════════════════
const SERVER       = "https://tikpanel-production.up.railway.app";
const STREAMER_NAME = "TOP LUZ ALVA"; // Nombre en el footer
const TOP_N        = 6;               // Cuántos mostrar
const DEMO_MODE    = true;            // false cuando tengas conexión real
// ══════════════════════════════════════════

document.getElementById("footerName").textContent = STREAMER_NAME;

// ── Generar partículas ──
const sparks = document.getElementById("sparks");
for (let i = 0; i < 18; i++) {
  const sp = document.createElement("div");
  sp.className = "sp";
  const size = Math.random() * 5 + 2;
  const colors = ["#fe2c55","#d580ff","#25f4ee","#ffd700","#ff9500","#ffffff"];
  const col = colors[Math.floor(Math.random() * colors.length)];
  sp.style.cssText = `
    width:${size}px; height:${size}px;
    left:${Math.random()*100}%;
    background:${col};
    box-shadow:0 0 ${size*3}px ${col};
    animation-duration:${Math.random()*6+4}s;
    animation-delay:${Math.random()*6}s;
  `;
  sparks.appendChild(sp);
}

// ── Estado ──
let rankings = {}; // user -> { nickname, likes, avatar }

// ── Render ──
function render() {
  const sorted = Object.entries(rankings)
    .sort((a, b) => b[1].likes - a[1].likes)
    .slice(0, TOP_N);

  if (sorted.length === 0) return;

  const list = document.getElementById("list");
  const existing = {};
  list.querySelectorAll(".item").forEach(el => existing[el.dataset.user] = el);

  sorted.forEach(([user, data], idx) => {
    const rank = idx + 1;
    const rankClass = rank===1?"rank-1":rank===2?"rank-2":rank===3?"rank-3":"rank-other";
    const crown = rank===1?"👑":rank===2?"🥈":rank===3?"🥉":"";
    const fmtLikes = n => n>=1e6?(n/1e6).toFixed(1)+"M":n>=1000?(n/1000).toFixed(1)+"K":n.toString();

    let item = existing[user];

    if (!item) {
      // Crear nuevo
      item = document.createElement("div");
      item.className = `item ${rankClass}`;
      item.dataset.user = user;
      item.style.animationDelay = (idx * 0.07) + "s";

      const avatarHTML = data.avatar
        ? `<img class="avatar" src="${data.avatar}" onerror="this.outerHTML='<div class=\\'avatar\\'>🙂</div>'">`
        : `<div class="avatar">🙂</div>`;

      item.innerHTML = `
        ${rank<=3?`<div class="mini-crown" style="font-size:${rank===1?'20px':'14px'}">${crown}</div>`:''}
        <div class="rank-num">${rank}</div>
        <div class="avatar-wrap">
          ${avatarHTML}
          <div class="avatar-ring"></div>
        </div>
        <div class="info">
          <div class="username">@${data.nickname||user}</div>
          <div class="likes-row">
            <div class="likes-num" data-val="${data.likes}">${fmtLikes(data.likes)}</div>
            <div class="likes-label">LIKES</div>
          </div>
        </div>
        <div class="heart">♥</div>
      `;
      list.appendChild(item);
    } else {
      // Actualizar clase si cambió posición
      item.className = `item ${rankClass}`;

      // Actualizar número con pop
      const numEl = item.querySelector(".likes-num");
      if (numEl) {
        const prev = Number(numEl.dataset.val || 0);
        if (data.likes !== prev) {
          numEl.dataset.val = data.likes;
          numEl.textContent = fmtLikes(data.likes);
          numEl.classList.remove("pop-anim");
          void numEl.offsetWidth;
          numEl.classList.add("pop-anim");
        }
      }

      list.appendChild(item); // reordenar
    }
  });

  // Eliminar los que salieron del top
  Object.keys(existing).forEach(u => {
    if (!sorted.find(([k]) => k === u)) existing[u].remove();
  });
}

// ── Conectar servidor real ──
function connectServer() {
  const s = document.createElement("script");
  s.src = SERVER + "/socket.io/socket.io.js";
  s.onload = () => {
    const sock = io(SERVER, { transports: ["polling","websocket"] });
    sock.on("event", d => {
      if (d.type !== "like") return;
      const u = d.user || "anon";
      const lc = Number(d.likeCount || 1);
      if (!rankings[u]) rankings[u] = { nickname: d.nickname||u, likes:0, avatar: d.avatar||"" };
      rankings[u].likes += lc;
      if (d.nickname) rankings[u].nickname = d.nickname;
      if (d.avatar)   rankings[u].avatar   = d.avatar;
      render();
    });
    sock.on("connect", () => console.log("Overlay conectado"));
  };
  s.onerror = () => { if (DEMO_MODE) startDemo(); };
  document.head.appendChild(s);
}

// ── DEMO ──
function startDemo() {
  const users = [
    { u:"gamerpromax",  n:"GamerProMax",    a:"", likes:52341 },
    { u:"tyrona18",     n:"Tyrona18",        a:"", likes:26110 },
    { u:"streamqueen",  n:"StreamQueen",     a:"", likes:29455 },
    { u:"alex_gamer",   n:"Alex_Gamer",      a:"", likes:21500 },
    { u:"luz_alva",     n:"⭐Luz Alva✨",    a:"", likes:15139 },
    { u:"pripania",     n:"Pripania",         a:"", likes:14000 },
  ];
  users.forEach(u => { rankings[u.u] = { nickname:u.n, likes:u.likes, avatar:u.a }; });
  render();

  setInterval(() => {
    const u = users[Math.floor(Math.random() * users.length)];
    rankings[u.u].likes += Math.floor(Math.random() * 80) + 1;
    render();
  }, 1200);
}

// ── Iniciar ──
if (DEMO_MODE) {
  startDemo();
} else {
  connectServer();
}
</script>
</body>
</html>
