<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Top Likes</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: transparent;
  width: 768px;
  height: 1376px;
  overflow: hidden;
  position: relative;
  font-family: 'Nunito', sans-serif;
}

/* Imagen plantilla de fondo */
.bg {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  object-fit: fill;
  z-index: 0;
  pointer-events: none;
}

/* Contenedor encima de la imagen */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
}

/* ── Cada fila del ranking ──
   Medido visualmente sobre la imagen 768x1376:
   #1 gold:   top ~262px, height ~130px
   #2 silver: top ~405px, height ~108px
   #3 bronze: top ~524px, height ~108px
   #4:        top ~643px, height ~108px
   #5:        top ~762px, height ~108px
   #6:        top ~880px, height ~108px
   left margen: ~115px, right: ~620px (ancho ~505px)
*/
.row {
  position: absolute;
  left: 118px;
  width: 510px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px 0 10px;
}

.row-1 { top: 268px; height: 120px; }
.row-2 { top: 408px; height: 100px; }
.row-3 { top: 518px; height: 100px; }
.row-4 { top: 630px; height: 100px; }
.row-5 { top: 742px; height: 100px; }
.row-6 { top: 853px; height: 100px; }

/* Rank badge */
.rbadge {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  flex-shrink: 0;
  min-width: 44px;
}
.rcrown { font-size: 20px; line-height: 1; }
.row-1 .rcrown { font-size: 26px; }
.rnum {
  font-family: 'Orbitron', monospace;
  font-weight: 900; line-height: 1;
  margin-top: -2px;
}
.row-1 .rnum { font-size: 30px; color: #c8860a; text-shadow: 0 0 10px rgba(200,134,10,0.5); }
.row-2 .rnum { font-size: 24px; color: #7090b0; }
.row-3 .rnum { font-size: 24px; color: #c07030; }
.row-4 .rnum { font-size: 22px; color: #a08060; }
.row-5 .rnum { font-size: 22px; color: #a08060; }
.row-6 .rnum { font-size: 22px; color: #a08060; }

/* Avatar */
.avwrap { position: relative; flex-shrink: 0; }
.av {
  border-radius: 50%;
  object-fit: cover; display: block;
  background: linear-gradient(135deg, #c8d8f8, #a0c0e8);
  line-height: 1; text-align: center;
  font-size: 22px; display: flex; align-items: center; justify-content: center;
  color: #6080b0; font-weight: 900;
  overflow: hidden;
}
.av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.row-1 .av { width: 80px; height: 80px; border: 3px solid #c8860a; box-shadow: 0 0 12px rgba(200,134,10,0.4); }
.row-2 .av { width: 68px; height: 68px; border: 2.5px solid #90aad0; }
.row-3 .av { width: 68px; height: 68px; border: 2.5px solid #d09050; }
.row-4 .av, .row-5 .av, .row-6 .av { width: 62px; height: 62px; border: 2px solid #c0a880; }

/* Anillo giratorio */
.avring {
  position: absolute; inset: -5px; border-radius: 50%;
  border: 2.5px solid transparent;
  animation: ringRot 4s linear infinite;
}
.row-1 .avring { border-top-color: #ffd700; border-right-color: #ffaa00; }
.row-2 .avring { border-top-color: #90b0d8; border-right-color: #6090c0; }
.row-3 .avring { border-top-color: #e09040; border-right-color: #c06020; }
.row-4 .avring, .row-5 .avring, .row-6 .avring { border-top-color: #c0a870; border-right-color: #a08050; animation-duration: 6s; }
@keyframes ringRot { to { transform: rotate(360deg); } }

/* Info */
.info { flex: 1; min-width: 0; }
.uname {
  font-weight: 900;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-bottom: 4px;
}
.row-1 .uname { font-size: 18px; color: #6040a0; }
.row-2 .uname { font-size: 15px; color: #5060a0; }
.row-3 .uname { font-size: 15px; color: #8060a0; }
.row-4 .uname, .row-5 .uname, .row-6 .uname { font-size: 14px; color: #7070a0; }

.lrow { display: flex; align-items: baseline; gap: 5px; }
.lnum {
  font-family: 'Orbitron', monospace;
  font-weight: 700;
  transition: transform .3s ease;
}
.row-1 .lnum { font-size: 26px; color: #8040c0; text-shadow: 0 0 8px rgba(128,64,192,0.3); }
.row-2 .lnum { font-size: 21px; color: #6070b0; }
.row-3 .lnum { font-size: 21px; color: #c06840; }
.row-4 .lnum, .row-5 .lnum, .row-6 .lnum { font-size: 19px; color: #a08050; }

.llabel {
  font-family: 'Orbitron', monospace; font-weight: 700;
  font-size: 11px; letter-spacing: 1px;
}
.row-1 .llabel { color: #aa60e0; }
.row-2 .llabel { color: #6090c0; }
.row-3 .llabel { color: #e08050; }
.row-4 .llabel, .row-5 .llabel, .row-6 .llabel { color: #c09060; }

/* Pop animación */
.pop { animation: popN .35s cubic-bezier(.22,1,.36,1); }
@keyframes popN {
  0%  { transform: scale(1.5); }
  100%{ transform: scale(1); }
}

/* Partículas suaves */
.spark {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  animation: sparkUp linear infinite;
  opacity: 0;
  z-index: 3;
}
@keyframes sparkUp {
  0%   { opacity:0; transform: translateY(0) scale(.3); }
  15%  { opacity:.6; }
  85%  { opacity:.4; }
  100% { opacity:0; transform: translateY(-400px) scale(1.2); }
}

/* Shimmer fila activa */
.row::after {
  content: '';
  position: absolute; inset: 0; border-radius: 12px;
  background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,0.06) 50%, transparent 80%);
  animation: sweep 8s linear infinite;
  pointer-events: none;
}
@keyframes sweep { 0% { transform:translateX(-120%); } 100% { transform:translateX(220%); } }
</style>
</head>
<body>

<!-- Plantilla de fondo -->
<img class="bg" src="plantilla.png" alt="">

<!-- Partículas decorativas suaves -->
<div id="sparks" style="position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;"></div>

<!-- Overlay de datos -->
<div class="overlay" id="overlay">
  <div class="row row-1" id="row-0"></div>
  <div class="row row-2" id="row-1"></div>
  <div class="row row-3" id="row-2"></div>
  <div class="row row-4" id="row-3"></div>
  <div class="row row-5" id="row-4"></div>
  <div class="row row-6" id="row-5"></div>
</div>

<script>
// ══ CONFIG ══════════════════════
const SERVER        = "https://tikpanel-production.up.railway.app";
const STREAMER_NAME = "TOP LUZ ALVA";
const TOP_N         = 6;
const DEMO_MODE     = true; // false = datos reales
// ════════════════════════════════

// Partículas muy suaves
(()=>{
  const c = document.getElementById("sparks");
  const cols = ["#d0a0ff","#a0c8ff","#ffd0f0","#ffe080","#a0f0ff"];
  for(let i=0;i<14;i++){
    const d = document.createElement("div");
    d.className = "spark";
    const s = Math.random()*5+2;
    const col = cols[Math.floor(Math.random()*cols.length)];
    d.style.cssText = `
      width:${s}px;height:${s}px;
      left:${Math.random()*100}%;
      bottom:${Math.random()*25+5}%;
      background:${col};
      box-shadow:0 0 ${s*3}px ${col};
      animation-duration:${Math.random()*14+12}s;
      animation-delay:${Math.random()*14}s;
    `;
    c.appendChild(d);
  }
})();

let rankings = {};
const fmt = n => n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":n.toLocaleString();

const CROWNS = ["👑","🥈","🥉","🎖️","🎖️","🎖️"];
const CROWN_SIZES = ["26px","20px","18px","16px","16px","16px"];

function renderRow(rowEl, rank, data){
  if(!data){
    rowEl.innerHTML = "";
    return;
  }

  const initial = (data.nickname||"?").replace(/@/g,"")[0]?.toUpperCase()||"?";

  // Avatar HTML
  const avInner = data.avatar
    ? `<img src="${data.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.style.display='none';this.parentNode.innerHTML='${initial}'">`
    : initial;

  // Buscar número existente para pop
  const existingNum = rowEl.querySelector(".lnum");
  const prevVal = existingNum ? Number(existingNum.dataset.v||0) : -1;
  const changed = prevVal !== data.likes;

  rowEl.innerHTML = `
    <div class="rbadge">
      <div class="rcrown" style="font-size:${CROWN_SIZES[rank-1]}">${CROWNS[rank-1]}</div>
      <div class="rnum">${rank}</div>
    </div>
    <div class="avwrap">
      <div class="av">${avInner}</div>
      <div class="avring"></div>
    </div>
    <div class="info">
      <div class="uname">@${data.nickname||"?"}</div>
      <div class="lrow">
        <div class="lnum ${changed&&prevVal>=0?'pop':''}" data-v="${data.likes}">${fmt(data.likes)}</div>
        <div class="llabel">LIKES</div>
      </div>
    </div>
  `;
}

function render(){
  const sorted = Object.entries(rankings)
    .sort((a,b)=>b[1].likes-a[1].likes)
    .slice(0,TOP_N);

  for(let i=0;i<TOP_N;i++){
    const rowEl = document.getElementById(`row-${i}`);
    if(!rowEl) continue;
    if(i < sorted.length){
      const [u, data] = sorted[i];
      renderRow(rowEl, i+1, data);
    } else {
      rowEl.innerHTML = "";
    }
  }
}

// Conexión real
function connectServer(){
  const s = document.createElement("script");
  s.src = SERVER+"/socket.io/socket.io.js";
  s.onload = ()=>{
    const sock = io(SERVER,{transports:["polling","websocket"]});
    sock.on("event", d=>{
      if(d.type!=="like") return;
      const u = d.user||"anon";
      if(!rankings[u]) rankings[u]={nickname:d.nickname||u, likes:0, avatar:d.avatar||""};
      rankings[u].likes += Number(d.likeCount||1);
      if(d.nickname) rankings[u].nickname=d.nickname;
      if(d.avatar)   rankings[u].avatar=d.avatar;
      render();
    });
  };
  s.onerror = ()=>{ if(DEMO_MODE) startDemo(); };
  document.head.appendChild(s);
}

// Demo con avatares
function startDemo(){
  const users = [
    {u:"gamerpromax", n:"GamerProMax",  l:52341, a:"https://i.pravatar.cc/150?img=11"},
    {u:"streamqueen", n:"StreamQueen",  l:29455, a:"https://i.pravatar.cc/150?img=47"},
    {u:"tyrona18",    n:"Tyrona18",     l:26110, a:"https://i.pravatar.cc/150?img=23"},
    {u:"alex_gamer",  n:"Alex_Gamer",   l:21500, a:"https://i.pravatar.cc/150?img=57"},
    {u:"luz_alva",    n:"⭐Luz Alva✨", l:15139, a:"https://i.pravatar.cc/150?img=33"},
    {u:"pripania",    n:"Pripania",     l:14000, a:"https://i.pravatar.cc/150?img=44"},
  ];
  users.forEach(u=>{ rankings[u.u]={nickname:u.n, likes:u.l, avatar:u.a}; });
  render();
  setInterval(()=>{
    const u = users[Math.floor(Math.random()*users.length)];
    rankings[u.u].likes += Math.floor(Math.random()*300)+10;
    render();
  }, 1800);
}

DEMO_MODE ? startDemo() : connectServer();
</script>
</body>
</html>
